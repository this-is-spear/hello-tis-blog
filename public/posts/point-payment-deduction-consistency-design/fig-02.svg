<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <defs>
    <marker id="bBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/></marker>
    <marker id="bPurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7c3aed"/></marker>
    <marker id="bGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7280"/></marker>
    <marker id="bAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#d97706"/></marker>
  </defs>

  <rect x="0" y="0" width="900" height="520" fill="#ffffff"/>
  <text x="450" y="34" text-anchor="middle" font-size="16" font-weight="700" fill="#111827">설계안 1 · 인프라 수준 — 전부 동기 체인</text>

  <!-- user -->
  <rect x="40" y="210" width="130" height="72" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="105" y="252" text-anchor="middle" font-size="14.5" font-weight="700" fill="#334155">사용자</text>

  <!-- order server -->
  <rect x="250" y="200" width="180" height="92" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="340" y="230" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1e3a5f">주문 서버</text>
  <text x="340" y="252" text-anchor="middle" font-size="12" fill="#475569">결제 유스케이스</text>
  <text x="340" y="270" text-anchor="middle" font-size="12" fill="#475569">보상 오케스트레이션</text>

  <!-- point server -->
  <rect x="560" y="70" width="170" height="92" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="645" y="104" text-anchor="middle" font-size="14.5" font-weight="700" fill="#4c1d95">포인트 서버</text>
  <text x="645" y="126" text-anchor="middle" font-size="12" fill="#475569">차감 · 복구 API</text>
  <text x="645" y="58" text-anchor="middle" font-size="11.5" font-weight="600" fill="#dc2626" stroke="#ffffff" stroke-width="5" paint-order="stroke">여기가 죽으면 결제가 막힌다</text>

  <!-- point db -->
  <rect x="560" y="210" width="170" height="76" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="645" y="240" text-anchor="middle" font-size="13" font-weight="700" fill="#92400e">포인트 DB — 원장</text>
  <text x="645" y="262" text-anchor="middle" font-size="12" fill="#475569">차감 · 복구 이력</text>

  <!-- external PG -->
  <rect x="560" y="340" width="170" height="80" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <text x="645" y="372" text-anchor="middle" font-size="14" font-weight="700" fill="#334155">외부 PG</text>
  <text x="645" y="394" text-anchor="middle" font-size="12" fill="#475569">취소 API · 수수료</text>

  <!-- retry queue -->
  <rect x="250" y="400" width="180" height="76" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <text x="340" y="430" text-anchor="middle" font-size="13.5" font-weight="700" fill="#334155">재시도 큐</text>
  <text x="340" y="452" text-anchor="middle" font-size="12" fill="#475569">복구 실패분 재처리</text>

  <!-- flows -->
  <line x1="170" y1="246" x2="244" y2="246" stroke="#6b7280" stroke-width="1.6" marker-end="url(#bGray)"/>
  <text x="207" y="236" text-anchor="middle" font-size="11.5" fill="#6b7280" stroke="#ffffff" stroke-width="5" paint-order="stroke">HTTP</text>

  <line x1="430" y1="218" x2="554" y2="116" stroke="#7c3aed" stroke-width="1.8" marker-end="url(#bPurple)"/>
  <text x="452" y="152" font-size="12" font-weight="600" fill="#7c3aed" stroke="#ffffff" stroke-width="5" paint-order="stroke">① 차감 — 동기 호출</text>
  <text x="452" y="170" font-size="11" fill="#7c3aed" stroke="#ffffff" stroke-width="5" paint-order="stroke">③ 승인 실패 시 복구(보상)</text>

  <line x1="645" y1="162" x2="645" y2="204" stroke="#d97706" stroke-width="1.6" marker-end="url(#bAmber)"/>
  <text x="655" y="188" font-size="11" fill="#6b7280">이력 기록</text>

  <line x1="430" y1="272" x2="554" y2="372" stroke="#2563eb" stroke-width="1.8" marker-end="url(#bBlue)"/>
  <text x="446" y="334" font-size="12" font-weight="600" fill="#2563eb" stroke="#ffffff" stroke-width="5" paint-order="stroke">② 결제 승인 (동기)</text>

  <line x1="340" y1="292" x2="340" y2="394" stroke="#6b7280" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#bGray)"/>
  <text x="350" y="348" font-size="11" fill="#6b7280" stroke="#ffffff" stroke-width="5" paint-order="stroke">복구 실패분 적재</text>

  <path d="M 430 424 C 540 410, 590 300, 610 168" fill="none" stroke="#7c3aed" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#bPurple)"/>
  <text x="530" y="310" font-size="11" fill="#7c3aed" stroke="#ffffff" stroke-width="5" paint-order="stroke">재시도</text>

  <text x="450" y="504" text-anchor="middle" font-size="11.5" fill="#94a3b8">동기 체인은 지연도 전파한다 — 외부 호출을 락 밖으로 빼는 이유 (상세안 2)</text>
</svg>
