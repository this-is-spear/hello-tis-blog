<svg xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" viewBox="0 0 900 560"><defs><marker id="cGreen" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#16a34a" d="M 0 0 L 10 5 L 0 10 z"/></marker><marker id="cRed" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#dc2626" d="M 0 0 L 10 5 L 0 10 z"/></marker><marker id="cGray" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#6b7280" d="M 0 0 L 10 5 L 0 10 z"/></marker></defs><rect width="900" height="560" x="0" y="0" fill="#fff"/><text x="450" y="34" fill="#111827" font-size="16" font-weight="700" text-anchor="middle">설계안 2 · 비즈니스 로직 수준 — 결제 먼저, 차감은 비동기 보정</text><text x="135" y="66" fill="#475569" font-size="12.5" text-anchor="middle">결제 요청</text><line x1="135" x2="135" y1="76" y2="104" stroke="#6b7280" stroke-width="1.6" marker-end="url(#cGray)"/><rect width="180" height="100" x="45" y="110" fill="#fffbeb" stroke="#d97706" stroke-width="1.5" rx="8"/><text x="135" y="140" fill="#92400e" font-size="14" font-weight="700" text-anchor="middle">① PG 결제 승인</text><text x="135" y="162" fill="#475569" font-size="12" text-anchor="middle">동기 호출은 이것 하나</text><rect width="180" height="100" x="265" y="110" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5" rx="8"/><text x="355" y="140" fill="#14532d" font-size="14" font-weight="700" text-anchor="middle">② 차감 이벤트 발행</text><text x="355" y="162" fill="#475569" font-size="12" text-anchor="middle">카프카에 기록만</text><text x="355" y="180" fill="#475569" font-size="12" text-anchor="middle">여기서 결제 완료 응답</text><rect width="180" height="100" x="485" y="110" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5" rx="8"/><text x="575" y="140" fill="#1e3a5f" font-size="14" font-weight="700" text-anchor="middle">③ 원장에 차감 기록</text><text x="575" y="162" fill="#475569" font-size="12" text-anchor="middle">컨슈머가 비동기 반영</text><text x="575" y="180" fill="#475569" font-size="12" text-anchor="middle">중복 제거 — 상세안 1</text><rect width="180" height="100" x="705" y="110" fill="#f8fafc" stroke="#64748b" stroke-width="1.5" rx="8"/><text x="795" y="140" fill="#334155" font-size="14" font-weight="700" text-anchor="middle">④ 대사 배치</text><text x="795" y="162" fill="#475569" font-size="12" text-anchor="middle">원장 ↔ PG 기록 대조</text><text x="795" y="180" fill="#475569" font-size="12" text-anchor="middle">누락 · 불일치 사후 보정</text><line x1="225" x2="259" y1="160" y2="160" stroke="#16a34a" stroke-width="1.8" marker-end="url(#cGreen)"/><text x="242" y="148" fill="#16a34a" stroke="#fff" stroke-width="5" font-size="11" font-weight="600" paint-order="stroke" text-anchor="middle">성공</text><line x1="445" x2="479" y1="160" y2="160" stroke="#16a34a" stroke-dasharray="5 4" stroke-width="1.8" marker-end="url(#cGreen)"/><text x="462" y="148" fill="#16a34a" stroke="#fff" stroke-width="5" font-size="11" font-weight="600" paint-order="stroke" text-anchor="middle">비동기</text><line x1="665" x2="699" y1="160" y2="160" stroke="#6b7280" stroke-dasharray="5 4" stroke-width="1.8" marker-end="url(#cGray)"/><text x="682" y="148" fill="#6b7280" stroke="#fff" stroke-width="5" font-size="11" font-weight="600" paint-order="stroke" text-anchor="middle">주기 실행</text><rect width="180" height="88" x="45" y="306" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5" rx="8"/><text x="135" y="338" fill="#991b1b" font-size="14" font-weight="700" text-anchor="middle">결제 실패로 종료</text><text x="135" y="360" fill="#475569" font-size="12" text-anchor="middle">포인트 건드린 적 없음</text><text x="135" y="378" fill="#475569" font-size="12" text-anchor="middle">보상 자체가 불필요</text><line x1="135" x2="135" y1="210" y2="300" stroke="#dc2626" stroke-width="1.8" marker-end="url(#cRed)"/><text x="145" y="260" fill="#dc2626" stroke="#fff" stroke-width="5" font-size="11.5" paint-order="stroke">승인 실패</text><line x1="300" x2="630" y1="246" y2="246" stroke="#dc2626" stroke-dasharray="5 4" stroke-width="1.4"/><line x1="300" x2="300" y1="240" y2="252" stroke="#dc2626" stroke-width="1.4"/><line x1="630" x2="630" y1="240" y2="252" stroke="#dc2626" stroke-width="1.4"/><text x="465" y="272" fill="#dc2626" stroke="#fff" stroke-width="5" font-size="12.5" font-weight="600" paint-order="stroke" text-anchor="middle">발행 → 반영 사이의 창</text><text x="465" y="292" fill="#b91c1c" stroke="#fff" stroke-width="5" font-size="11.5" paint-order="stroke" text-anchor="middle">조회에는 차감 전 잔액이 보인다 — 이중 사용 위험</text><text x="465" y="310" fill="#b91c1c" stroke="#fff" stroke-width="5" font-size="11.5" paint-order="stroke" text-anchor="middle">방어선: 1인당 사용 한도 · 어뷰징 탐지</text><path fill="none" stroke="#6b7280" stroke-dasharray="5 4" stroke-width="1.6" marker-end="url(#cGray)" d="M 795 210 C 795 300, 740 340, 668 352"/><text x="800" y="300" fill="#6b7280" stroke="#fff" stroke-width="5" font-size="11.5" paint-order="stroke">불일치 발견 시</text><text x="800" y="316" fill="#6b7280" stroke="#fff" stroke-width="5" font-size="11.5" paint-order="stroke">보정 이력 추가</text><text x="660" y="376" fill="#6b7280" font-size="11.5" text-anchor="end">마이너스 잔액 정책 필요</text><text x="660" y="392" fill="#6b7280" font-size="11.5" text-anchor="end">(다음 적립 상계 또는 회수)</text><text x="450" y="540" fill="#94a3b8" font-size="11.5" text-anchor="middle">결제는 멈추지 않는다 — 오차는 배치가 사후에 흡수한다 (가용성 우선)</text></svg>