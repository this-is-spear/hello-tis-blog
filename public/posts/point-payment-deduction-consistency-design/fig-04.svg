<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 580" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <defs>
    <marker id="dBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/></marker>
    <marker id="dGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/></marker>
    <marker id="dPurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7c3aed"/></marker>
    <marker id="dGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7280"/></marker>
  </defs>

  <rect x="0" y="0" width="900" height="580" fill="#ffffff"/>
  <text x="450" y="34" text-anchor="middle" font-size="16" font-weight="700" fill="#111827">설계안 2 · 인프라 수준 — 브로커가 결제와 포인트를 분리한다</text>

  <!-- user -->
  <rect x="40" y="110" width="120" height="70" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="100" y="150" text-anchor="middle" font-size="14.5" font-weight="700" fill="#334155">사용자</text>

  <!-- order server -->
  <rect x="230" y="100" width="170" height="90" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="315" y="130" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1e3a5f">주문 서버</text>
  <text x="315" y="152" text-anchor="middle" font-size="12" fill="#475569">결제 유스케이스</text>
  <text x="315" y="170" text-anchor="middle" font-size="12" fill="#475569">이벤트 발행 후 응답</text>

  <!-- external PG -->
  <rect x="690" y="90" width="170" height="80" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <text x="775" y="122" text-anchor="middle" font-size="14" font-weight="700" fill="#334155">외부 PG</text>
  <text x="775" y="144" text-anchor="middle" font-size="12" fill="#475569">결제 승인</text>

  <!-- kafka -->
  <rect x="230" y="290" width="260" height="108" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="360" y="320" text-anchor="middle" font-size="14" font-weight="700" fill="#14532d">카프카 브로커</text>
  <text x="360" y="342" text-anchor="middle" font-size="12" fill="#475569">차감 이벤트 · 7일 보존</text>
  <text x="360" y="360" text-anchor="middle" font-size="12" fill="#475569">사용자 ID 메시지 키</text>
  <text x="360" y="378" text-anchor="middle" font-size="11" fill="#94a3b8">같은 사용자 = 같은 파티션 = 순서 보장</text>

  <!-- consumer -->
  <rect x="580" y="300" width="170" height="88" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="665" y="330" text-anchor="middle" font-size="14" font-weight="700" fill="#4c1d95">포인트 컨슈머</text>
  <text x="665" y="352" text-anchor="middle" font-size="12" fill="#475569">순차 소비</text>
  <text x="665" y="370" text-anchor="middle" font-size="12" fill="#475569">중복 제거 — 상세안 1</text>

  <!-- point db -->
  <rect x="450" y="450" width="200" height="96" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="550" y="482" text-anchor="middle" font-size="14" font-weight="700" fill="#92400e">포인트 DB — 원장</text>
  <text x="550" y="504" text-anchor="middle" font-size="12" fill="#475569">append-only 이력</text>

  <!-- reconciliation batch -->
  <rect x="180" y="456" width="190" height="84" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <text x="275" y="488" text-anchor="middle" font-size="13.5" font-weight="700" fill="#334155">대사 배치</text>
  <text x="275" y="510" text-anchor="middle" font-size="11.5" fill="#475569">원장 ↔ PG 기록 대조 · 보정</text>

  <!-- read server -->
  <rect x="700" y="456" width="165" height="84" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="782" y="488" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1e3a5f">포인트 조회 서버</text>
  <text x="782" y="510" text-anchor="middle" font-size="12" fill="#475569">잔액 조회</text>
  <text x="782" y="560" text-anchor="middle" font-size="11.5" font-weight="600" fill="#dc2626" stroke="#ffffff" stroke-width="5" paint-order="stroke">반영 전 옛 잔액 노출 — 이중 사용 창</text>

  <!-- flows -->
  <line x1="160" y1="145" x2="224" y2="145" stroke="#6b7280" stroke-width="1.6" marker-end="url(#dGray)"/>
  <text x="192" y="135" text-anchor="middle" font-size="11.5" fill="#6b7280" stroke="#ffffff" stroke-width="5" paint-order="stroke">HTTP</text>

  <line x1="400" y1="135" x2="684" y2="126" stroke="#2563eb" stroke-width="1.8" marker-end="url(#dBlue)"/>
  <text x="540" y="120" text-anchor="middle" font-size="12" font-weight="600" fill="#2563eb" stroke="#ffffff" stroke-width="5" paint-order="stroke">① 결제 승인 — 유일한 동기 구간</text>

  <line x1="315" y1="190" x2="315" y2="284" stroke="#16a34a" stroke-width="1.8" marker-end="url(#dGreen)"/>
  <text x="325" y="242" font-size="12" font-weight="600" fill="#16a34a" stroke="#ffffff" stroke-width="5" paint-order="stroke">② 발행</text>

  <line x1="490" y1="344" x2="574" y2="344" stroke="#16a34a" stroke-width="1.8" marker-end="url(#dGreen)"/>
  <text x="532" y="334" text-anchor="middle" font-size="12" font-weight="600" fill="#16a34a" stroke="#ffffff" stroke-width="5" paint-order="stroke">③ 구독</text>

  <line x1="645" y1="388" x2="595" y2="444" stroke="#7c3aed" stroke-width="1.8" marker-end="url(#dPurple)"/>
  <text x="660" y="422" font-size="11.5" font-weight="600" fill="#7c3aed" stroke="#ffffff" stroke-width="5" paint-order="stroke">차감 기록</text>

  <line x1="370" y1="494" x2="444" y2="494" stroke="#6b7280" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#dGray)"/>
  <text x="408" y="484" text-anchor="middle" font-size="11" font-weight="600" fill="#6b7280" stroke="#ffffff" stroke-width="5" paint-order="stroke">④ 대조 · 보정</text>

  <line x1="694" y1="494" x2="656" y2="494" stroke="#2563eb" stroke-width="1.6" marker-end="url(#dBlue)"/>
  <text x="675" y="484" text-anchor="middle" font-size="11" font-weight="600" fill="#2563eb" stroke="#ffffff" stroke-width="5" paint-order="stroke">조회</text>

  <text x="360" y="418" text-anchor="middle" font-size="11.5" font-weight="600" fill="#16a34a" stroke="#ffffff" stroke-width="5" paint-order="stroke">브로커가 완충 — 포인트 쪽이 죽어도 결제는 계속</text>

  <text x="450" y="572" text-anchor="middle" font-size="11.5" fill="#94a3b8">동기 화살표는 ① 하나 — 포인트 서버 · 컨슈머 장애가 결제로 전파되지 않는다</text>
</svg>
