<svg xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" viewBox="0 0 900 580"><defs><marker id="dBlue" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#2563eb" d="M 0 0 L 10 5 L 0 10 z"/></marker><marker id="dGreen" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#16a34a" d="M 0 0 L 10 5 L 0 10 z"/></marker><marker id="dPurple" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#7c3aed" d="M 0 0 L 10 5 L 0 10 z"/></marker><marker id="dGray" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#6b7280" d="M 0 0 L 10 5 L 0 10 z"/></marker></defs><rect width="900" height="580" x="0" y="0" fill="#fff"/><text x="450" y="34" fill="#111827" font-size="16" font-weight="700" text-anchor="middle">설계안 2 · 인프라 수준 — 브로커가 결제와 포인트를 분리한다</text><rect width="120" height="70" x="40" y="110" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" rx="8"/><text x="100" y="150" fill="#334155" font-size="14.5" font-weight="700" text-anchor="middle">사용자</text><rect width="170" height="90" x="230" y="100" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5" rx="8"/><text x="315" y="130" fill="#1e3a5f" font-size="14.5" font-weight="700" text-anchor="middle">주문 서버</text><text x="315" y="152" fill="#475569" font-size="12" text-anchor="middle">결제 유스케이스</text><text x="315" y="170" fill="#475569" font-size="12" text-anchor="middle">이벤트 발행 후 응답</text><rect width="170" height="80" x="690" y="90" fill="#f8fafc" stroke="#64748b" stroke-width="1.5" rx="8"/><text x="775" y="122" fill="#334155" font-size="14" font-weight="700" text-anchor="middle">외부 PG</text><text x="775" y="144" fill="#475569" font-size="12" text-anchor="middle">결제 승인</text><rect width="260" height="108" x="230" y="290" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5" rx="8"/><text x="360" y="320" fill="#14532d" font-size="14" font-weight="700" text-anchor="middle">카프카 브로커</text><text x="360" y="342" fill="#475569" font-size="12" text-anchor="middle">차감 이벤트 · 7일 보존</text><text x="360" y="360" fill="#475569" font-size="12" text-anchor="middle">사용자 ID 메시지 키</text><text x="360" y="378" fill="#94a3b8" font-size="11" text-anchor="middle">같은 사용자 = 같은 파티션 = 순서 보장</text><rect width="170" height="88" x="580" y="300" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5" rx="8"/><text x="665" y="330" fill="#4c1d95" font-size="14" font-weight="700" text-anchor="middle">포인트 컨슈머</text><text x="665" y="352" fill="#475569" font-size="12" text-anchor="middle">순차 소비</text><text x="665" y="370" fill="#475569" font-size="12" text-anchor="middle">중복 제거 — 상세안 1</text><rect width="200" height="96" x="450" y="450" fill="#fffbeb" stroke="#d97706" stroke-width="2" rx="8"/><text x="550" y="482" fill="#92400e" font-size="14" font-weight="700" text-anchor="middle">포인트 DB — 원장</text><text x="550" y="504" fill="#475569" font-size="12" text-anchor="middle">append-only 이력</text><rect width="190" height="84" x="180" y="456" fill="#f8fafc" stroke="#64748b" stroke-width="1.5" rx="8"/><text x="275" y="488" fill="#334155" font-size="13.5" font-weight="700" text-anchor="middle">대사 배치</text><text x="275" y="510" fill="#475569" font-size="11.5" text-anchor="middle">원장 ↔ PG 기록 대조 · 보정</text><rect width="165" height="84" x="700" y="456" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5" rx="8"/><text x="782" y="488" fill="#1e3a5f" font-size="13.5" font-weight="700" text-anchor="middle">포인트 조회 서버</text><text x="782" y="510" fill="#475569" font-size="12" text-anchor="middle">잔액 조회</text><text x="782" y="560" fill="#dc2626" stroke="#fff" stroke-width="5" font-size="11.5" font-weight="600" paint-order="stroke" text-anchor="middle">반영 전 옛 잔액 노출 — 이중 사용 창</text><line x1="160" x2="224" y1="145" y2="145" stroke="#6b7280" stroke-width="1.6" marker-end="url(#dGray)"/><text x="192" y="135" fill="#6b7280" stroke="#fff" stroke-width="5" font-size="11.5" paint-order="stroke" text-anchor="middle">HTTP</text><line x1="400" x2="684" y1="135" y2="126" stroke="#2563eb" stroke-width="1.8" marker-end="url(#dBlue)"/><text x="540" y="120" fill="#2563eb" stroke="#fff" stroke-width="5" font-size="12" font-weight="600" paint-order="stroke" text-anchor="middle">① 결제 승인 — 유일한 동기 구간</text><line x1="315" x2="315" y1="190" y2="284" stroke="#16a34a" stroke-width="1.8" marker-end="url(#dGreen)"/><text x="325" y="242" fill="#16a34a" stroke="#fff" stroke-width="5" font-size="12" font-weight="600" paint-order="stroke">② 발행</text><line x1="490" x2="574" y1="344" y2="344" stroke="#16a34a" stroke-width="1.8" marker-end="url(#dGreen)"/><text x="532" y="334" fill="#16a34a" stroke="#fff" stroke-width="5" font-size="12" font-weight="600" paint-order="stroke" text-anchor="middle">③ 구독</text><line x1="645" x2="595" y1="388" y2="444" stroke="#7c3aed" stroke-width="1.8" marker-end="url(#dPurple)"/><text x="660" y="422" fill="#7c3aed" stroke="#fff" stroke-width="5" font-size="11.5" font-weight="600" paint-order="stroke">차감 기록</text><line x1="370" x2="444" y1="494" y2="494" stroke="#6b7280" stroke-dasharray="5 4" stroke-width="1.6" marker-end="url(#dGray)"/><text x="408" y="484" fill="#6b7280" stroke="#fff" stroke-width="5" font-size="11" font-weight="600" paint-order="stroke" text-anchor="middle">④ 대조 · 보정</text><line x1="694" x2="656" y1="494" y2="494" stroke="#2563eb" stroke-width="1.6" marker-end="url(#dBlue)"/><text x="675" y="484" fill="#2563eb" stroke="#fff" stroke-width="5" font-size="11" font-weight="600" paint-order="stroke" text-anchor="middle">조회</text><text x="360" y="418" fill="#16a34a" stroke="#fff" stroke-width="5" font-size="11.5" font-weight="600" paint-order="stroke" text-anchor="middle">브로커가 완충 — 포인트 쪽이 죽어도 결제는 계속</text><text x="450" y="572" fill="#94a3b8" font-size="11.5" text-anchor="middle">동기 화살표는 ① 하나 — 포인트 서버 · 컨슈머 장애가 결제로 전파되지 않는다</text></svg>