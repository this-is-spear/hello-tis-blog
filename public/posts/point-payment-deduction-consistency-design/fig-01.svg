<svg xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" viewBox="0 0 900 548"><defs><marker id="aGreen" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#16a34a" d="M 0 0 L 10 5 L 0 10 z"/></marker><marker id="aRed" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#dc2626" d="M 0 0 L 10 5 L 0 10 z"/></marker><marker id="aPurple" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#7c3aed" d="M 0 0 L 10 5 L 0 10 z"/></marker><marker id="aGray" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#6b7280" d="M 0 0 L 10 5 L 0 10 z"/></marker></defs><rect width="900" height="548" x="0" y="0" fill="#fff"/><text x="450" y="34" fill="#111827" font-size="16" font-weight="700" text-anchor="middle">설계안 1 · 비즈니스 로직 수준 — 포인트 차감 먼저, 보상은 역방향</text><text x="155" y="66" fill="#475569" font-size="12.5" text-anchor="middle">결제 요청</text><line x1="155" x2="155" y1="76" y2="104" stroke="#6b7280" stroke-width="1.6" marker-end="url(#aGray)"/><rect width="190" height="96" x="60" y="110" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5" rx="8"/><text x="155" y="140" fill="#1e3a5f" font-size="14.5" font-weight="700" text-anchor="middle">① 포인트 차감</text><text x="155" y="162" fill="#475569" font-size="12" text-anchor="middle">자사 원장에 차감 이력 추가</text><text x="155" y="180" fill="#475569" font-size="12" text-anchor="middle">복구가 우리 손에 있다</text><rect width="190" height="96" x="355" y="110" fill="#fffbeb" stroke="#d97706" stroke-width="1.5" rx="8"/><text x="450" y="140" fill="#92400e" font-size="14.5" font-weight="700" text-anchor="middle">② PG 결제 승인</text><text x="450" y="162" fill="#475569" font-size="12" text-anchor="middle">외부 시스템 호출</text><text x="450" y="180" fill="#475569" font-size="12" text-anchor="middle">가장 되돌리기 어려운 조치</text><rect width="200" height="96" x="650" y="110" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5" rx="8"/><text x="750" y="140" fill="#14532d" font-size="14.5" font-weight="700" text-anchor="middle">③ 주문 확정 · 적립 지급</text><text x="750" y="162" fill="#475569" font-size="12" text-anchor="middle">지급은 항상 마지막</text><line x1="250" x2="349" y1="158" y2="158" stroke="#16a34a" stroke-width="1.8" marker-end="url(#aGreen)"/><text x="300" y="148" fill="#16a34a" stroke="#fff" stroke-width="5" font-size="12" font-weight="600" paint-order="stroke" text-anchor="middle">차감 성공</text><line x1="545" x2="644" y1="158" y2="158" stroke="#16a34a" stroke-width="1.8" marker-end="url(#aGreen)"/><text x="594" y="148" fill="#16a34a" stroke="#fff" stroke-width="5" font-size="12" font-weight="600" paint-order="stroke" text-anchor="middle">승인 성공</text><rect width="190" height="88" x="60" y="310" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5" rx="8"/><text x="155" y="344" fill="#991b1b" font-size="14" font-weight="700" text-anchor="middle">결제 실패로 종료</text><text x="155" y="366" fill="#475569" font-size="12" text-anchor="middle">정합성 깨진 구간 없음</text><line x1="155" x2="155" y1="206" y2="304" stroke="#dc2626" stroke-width="1.8" marker-end="url(#aRed)"/><text x="165" y="258" fill="#dc2626" stroke="#fff" stroke-width="5" font-size="11.5" paint-order="stroke">잔액 부족 · 포인트 서버 장애</text><rect width="190" height="96" x="355" y="310" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5" rx="8"/><text x="450" y="340" fill="#4c1d95" font-size="14" font-weight="700" text-anchor="middle">보상 — 포인트 복구</text><text x="450" y="362" fill="#475569" font-size="12" text-anchor="middle">복구 이력 추가 (롤백 아님)</text><text x="450" y="380" fill="#475569" font-size="12" text-anchor="middle">멱등 복구 — 상세안 3</text><line x1="450" x2="450" y1="206" y2="304" stroke="#dc2626" stroke-width="1.8" marker-end="url(#aRed)"/><text x="460" y="258" fill="#dc2626" stroke="#fff" stroke-width="5" font-size="11.5" paint-order="stroke">승인 실패</text><line x1="349" x2="256" y1="354" y2="354" stroke="#7c3aed" stroke-width="1.8" marker-end="url(#aPurple)"/><text x="302" y="344" fill="#7c3aed" stroke="#fff" stroke-width="5" font-size="11.5" font-weight="600" paint-order="stroke" text-anchor="middle">복구 성공</text><rect width="190" height="72" x="355" y="452" fill="#f8fafc" stroke="#64748b" stroke-width="1.5" rx="8"/><text x="450" y="482" fill="#334155" font-size="13.5" font-weight="700" text-anchor="middle">재시도 큐</text><text x="450" y="504" fill="#475569" font-size="12" text-anchor="middle">반복 실행해도 안전 (멱등)</text><line x1="450" x2="450" y1="406" y2="446" stroke="#dc2626" stroke-dasharray="5 4" stroke-width="1.6" marker-end="url(#aRed)"/><text x="460" y="430" fill="#dc2626" stroke="#fff" stroke-width="5" font-size="11.5" paint-order="stroke">복구 실패</text><path fill="none" stroke="#7c3aed" stroke-dasharray="5 4" stroke-width="1.6" marker-end="url(#aPurple)" d="M 551 480 C 592 452, 592 396, 551 372"/><text x="600" y="430" fill="#7c3aed" stroke="#fff" stroke-width="5" font-size="11.5" paint-order="stroke">재시도</text><text x="450" y="536" fill="#94a3b8" font-size="11.5" text-anchor="middle">포인트 서버가 죽으면 ①에서 결제 전체가 멈춘다 — 일관성을 얻는 대신 가용성을 내준다</text></svg>