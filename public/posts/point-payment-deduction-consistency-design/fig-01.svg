<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 548" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <defs>
    <marker id="aGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/></marker>
    <marker id="aRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/></marker>
    <marker id="aPurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7c3aed"/></marker>
    <marker id="aGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7280"/></marker>
  </defs>

  <rect x="0" y="0" width="900" height="548" fill="#ffffff"/>
  <text x="450" y="34" text-anchor="middle" font-size="16" font-weight="700" fill="#111827">설계안 1 · 비즈니스 로직 수준 — 포인트 차감 먼저, 보상은 역방향</text>

  <!-- entry -->
  <text x="155" y="66" text-anchor="middle" font-size="12.5" fill="#475569">결제 요청</text>
  <line x1="155" y1="76" x2="155" y2="104" stroke="#6b7280" stroke-width="1.6" marker-end="url(#aGray)"/>

  <!-- step 1: point deduction -->
  <rect x="60" y="110" width="190" height="96" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="155" y="140" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1e3a5f">① 포인트 차감</text>
  <text x="155" y="162" text-anchor="middle" font-size="12" fill="#475569">자사 원장에 차감 이력 추가</text>
  <text x="155" y="180" text-anchor="middle" font-size="12" fill="#475569">복구가 우리 손에 있다</text>

  <!-- step 2: PG approval -->
  <rect x="355" y="110" width="190" height="96" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="450" y="140" text-anchor="middle" font-size="14.5" font-weight="700" fill="#92400e">② PG 결제 승인</text>
  <text x="450" y="162" text-anchor="middle" font-size="12" fill="#475569">외부 시스템 호출</text>
  <text x="450" y="180" text-anchor="middle" font-size="12" fill="#475569">가장 되돌리기 어려운 조치</text>

  <!-- step 3: confirm -->
  <rect x="650" y="110" width="200" height="96" rx="8" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/>
  <text x="750" y="140" text-anchor="middle" font-size="14.5" font-weight="700" fill="#14532d">③ 주문 확정 · 적립 지급</text>
  <text x="750" y="162" text-anchor="middle" font-size="12" fill="#475569">지급은 항상 마지막</text>

  <!-- success arrows -->
  <line x1="250" y1="158" x2="349" y2="158" stroke="#16a34a" stroke-width="1.8" marker-end="url(#aGreen)"/>
  <text x="300" y="148" text-anchor="middle" font-size="12" font-weight="600" fill="#16a34a" stroke="#ffffff" stroke-width="5" paint-order="stroke">차감 성공</text>
  <line x1="545" y1="158" x2="644" y2="158" stroke="#16a34a" stroke-width="1.8" marker-end="url(#aGreen)"/>
  <text x="594" y="148" text-anchor="middle" font-size="12" font-weight="600" fill="#16a34a" stroke="#ffffff" stroke-width="5" paint-order="stroke">승인 성공</text>

  <!-- fail: deduction -->
  <rect x="60" y="310" width="190" height="88" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="155" y="344" text-anchor="middle" font-size="14" font-weight="700" fill="#991b1b">결제 실패로 종료</text>
  <text x="155" y="366" text-anchor="middle" font-size="12" fill="#475569">정합성 깨진 구간 없음</text>
  <line x1="155" y1="206" x2="155" y2="304" stroke="#dc2626" stroke-width="1.8" marker-end="url(#aRed)"/>
  <text x="165" y="258" font-size="11.5" fill="#dc2626" stroke="#ffffff" stroke-width="5" paint-order="stroke">잔액 부족 · 포인트 서버 장애</text>

  <!-- fail: approval -> compensation -->
  <rect x="355" y="310" width="190" height="96" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="450" y="340" text-anchor="middle" font-size="14" font-weight="700" fill="#4c1d95">보상 — 포인트 복구</text>
  <text x="450" y="362" text-anchor="middle" font-size="12" fill="#475569">복구 이력 추가 (롤백 아님)</text>
  <text x="450" y="380" text-anchor="middle" font-size="12" fill="#475569">멱등 복구 — 상세안 3</text>
  <line x1="450" y1="206" x2="450" y2="304" stroke="#dc2626" stroke-width="1.8" marker-end="url(#aRed)"/>
  <text x="460" y="258" font-size="11.5" fill="#dc2626" stroke="#ffffff" stroke-width="5" paint-order="stroke">승인 실패</text>

  <!-- compensation success -->
  <line x1="349" y1="354" x2="256" y2="354" stroke="#7c3aed" stroke-width="1.8" marker-end="url(#aPurple)"/>
  <text x="302" y="344" text-anchor="middle" font-size="11.5" font-weight="600" fill="#7c3aed" stroke="#ffffff" stroke-width="5" paint-order="stroke">복구 성공</text>

  <!-- compensation fail -> retry queue -->
  <rect x="355" y="452" width="190" height="72" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <text x="450" y="482" text-anchor="middle" font-size="13.5" font-weight="700" fill="#334155">재시도 큐</text>
  <text x="450" y="504" text-anchor="middle" font-size="12" fill="#475569">반복 실행해도 안전 (멱등)</text>
  <line x1="450" y1="406" x2="450" y2="446" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#aRed)"/>
  <text x="460" y="430" font-size="11.5" fill="#dc2626" stroke="#ffffff" stroke-width="5" paint-order="stroke">복구 실패</text>
  <path d="M 551 480 C 592 452, 592 396, 551 372" fill="none" stroke="#7c3aed" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#aPurple)"/>
  <text x="600" y="430" font-size="11.5" fill="#7c3aed" stroke="#ffffff" stroke-width="5" paint-order="stroke">재시도</text>

  <text x="450" y="536" text-anchor="middle" font-size="11.5" fill="#94a3b8">포인트 서버가 죽으면 ①에서 결제 전체가 멈춘다 — 일관성을 얻는 대신 가용성을 내준다</text>
</svg>
