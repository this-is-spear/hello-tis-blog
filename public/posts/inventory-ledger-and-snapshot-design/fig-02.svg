<svg xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" viewBox="0 0 880 720"><defs><marker id="arrow2" markerHeight="8" markerWidth="8" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#374151" d="M 0 0 L 10 5 L 0 10 z"/></marker><pattern id="hatch" width="6" height="6" patternTransform="rotate(45)" patternUnits="userSpaceOnUse"><rect width="6" height="6" fill="#fff7ed"/><line x1="0" x2="0" y1="0" y2="6" stroke="#fb923c" stroke-width="1.5"/></pattern></defs><rect width="880" height="720" x="0" y="0" fill="#fff"/><text x="440" y="38" fill="#111827" font-size="17" font-weight="700" text-anchor="middle">S lock은 어디에 걸리나 — row(인덱스 레코드) 단위 vs 범위</text><rect width="820" height="290" x="30" y="58" fill="#f8fafc" stroke="#cbd5e1" rx="10"/><text x="52" y="88" fill="#1e3a5f" font-size="15" font-weight="700">① FK 검사의 S lock — 참조한 인덱스 레코드 하나에만 걸린다</text><rect width="320" height="96" x="55" y="108" fill="#0f172a" rx="6"/><text x="70" y="134" fill="#e2e8f0" font-family="'SF Mono', Menlo, monospace" font-size="12.5">원장에 insert</text><text x="70" y="154" fill="#e2e8f0" font-family="'SF Mono', Menlo, monospace" font-size="12.5">(product_id = 42, quantity = -1)</text><text x="70" y="186" fill="#93c5fd" font-size="12">FK 검사 : 스냅샷에 42가 존재하는가?</text><text x="55" y="228" fill="#475569" font-size="12.5">PK를 점(point) 조회 → 딱 그 레코드에만</text><text x="55" y="246" fill="#475569" font-size="12.5">S lock을 남긴다 (범위 아님)</text><line x1="378" x2="452" y1="170" y2="245" stroke="#374151" stroke-width="1.6" marker-end="url(#arrow2)"/><rect width="280" height="30" x="460" y="108" fill="#e2e8f0" stroke="#94a3b8"/><text x="600" y="128" fill="#334155" font-size="13" font-weight="700" text-anchor="middle">스냅샷 — PK 인덱스</text><rect width="280" height="30" x="460" y="138" fill="#fff" stroke="#cbd5e1"/><text x="480" y="158" fill="#334155" font-family="'SF Mono', Menlo, monospace" font-size="12.5">40 │ qty 120</text><rect width="280" height="30" x="460" y="168" fill="#fff" stroke="#cbd5e1"/><text x="480" y="188" fill="#334155" font-family="'SF Mono', Menlo, monospace" font-size="12.5">41 │ qty 3</text><rect width="280" height="30" x="460" y="198" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/><text x="480" y="218" fill="#1e40af" font-family="'SF Mono', Menlo, monospace" font-size="12.5" font-weight="700">42 │ qty 87</text><rect width="280" height="30" x="460" y="228" fill="#fff" stroke="#cbd5e1"/><text x="480" y="248" fill="#334155" font-family="'SF Mono', Menlo, monospace" font-size="12.5">43 │ qty 0</text><rect width="76" height="24" x="756" y="201" fill="#dbeafe" stroke="#3b82f6" rx="12"/><text x="794" y="217" fill="#1e40af" font-size="12" font-weight="700" text-anchor="middle">S lock</text><text x="460" y="290" fill="#475569" font-size="12.5">40·41·43에는 아무 락도 없다</text><text x="460" y="308" fill="#475569" font-size="12.5">→ 다른 상품의 주문은 전혀 대기하지 않는다</text><text x="52" y="332" fill="#64748b" font-size="12.5">※ 데드락 글의 시나리오는 A와 B가 같은 상품(42)을 사서, 같은 레코드 위에서 S lock이 겹친 경우다</text><rect width="820" height="330" x="30" y="368" fill="#fffbf5" stroke="#fdba74" rx="10"/><text x="52" y="398" fill="#9a3412" font-size="15" font-weight="700">② 락이 &quot;범위&quot;로 걸리는 경우는 따로 있다 — next-key(gap) lock</text><rect width="330" height="96" x="55" y="418" fill="#0f172a" rx="6"/><text x="70" y="444" fill="#e2e8f0" font-family="'SF Mono', Menlo, monospace" font-size="12.5">스냅샷을 범위 조건으로 update</text><text x="70" y="464" fill="#e2e8f0" font-family="'SF Mono', Menlo, monospace" font-size="12.5">(product_id 41 ~ 43)</text><text x="70" y="496" fill="#fdba74" font-size="12">범위 스캔 (REPEATABLE READ)</text><text x="55" y="540" fill="#7c2d12" font-size="12.5">스캔이 지나간 레코드 + 레코드 사이 틈(gap)까지</text><text x="55" y="558" fill="#7c2d12" font-size="12.5">잠긴다 → 범위 안 신규 insert도 차단된다</text><line x1="388" x2="452" y1="466" y2="500" stroke="#374151" stroke-width="1.6" marker-end="url(#arrow2)"/><rect width="280" height="28" x="460" y="418" fill="#e2e8f0" stroke="#94a3b8"/><text x="600" y="437" fill="#334155" font-size="13" font-weight="700" text-anchor="middle">스냅샷 — PK 인덱스</text><rect width="280" height="28" x="460" y="446" fill="#fff" stroke="#cbd5e1"/><text x="480" y="465" fill="#334155" font-family="'SF Mono', Menlo, monospace" font-size="12.5">40 │ qty 120</text><rect width="280" height="10" x="460" y="474" fill="url(#hatch)" stroke="#fb923c" stroke-width=".8"/><rect width="280" height="28" x="460" y="484" fill="#ffedd5" stroke="#f97316" stroke-width="1.5"/><text x="480" y="503" fill="#9a3412" font-family="'SF Mono', Menlo, monospace" font-size="12.5" font-weight="700">41 │ qty 3</text><rect width="280" height="10" x="460" y="512" fill="url(#hatch)" stroke="#fb923c" stroke-width=".8"/><rect width="280" height="28" x="460" y="522" fill="#ffedd5" stroke="#f97316" stroke-width="1.5"/><text x="480" y="541" fill="#9a3412" font-family="'SF Mono', Menlo, monospace" font-size="12.5" font-weight="700">42 │ qty 87</text><rect width="280" height="10" x="460" y="550" fill="url(#hatch)" stroke="#fb923c" stroke-width=".8"/><rect width="280" height="28" x="460" y="560" fill="#ffedd5" stroke="#f97316" stroke-width="1.5"/><text x="480" y="579" fill="#9a3412" font-family="'SF Mono', Menlo, monospace" font-size="12.5" font-weight="700">43 │ qty 0</text><path fill="none" stroke="#f97316" stroke-width="1.6" d="M 750 476 L 762 476 L 762 586 L 750 586"/><text x="772" y="524" fill="#9a3412" font-size="12" font-weight="700">next-key</text><text x="772" y="540" fill="#9a3412" font-size="12" font-weight="700">lock</text><text x="480" y="606" fill="#9a3412" font-size="11.5">빗금 = gap lock (레코드 사이 틈)</text><line x1="52" x2="828" y1="624" y2="624" stroke="#fdba74" stroke-dasharray="4 4"/><text x="52" y="648" fill="#7c2d12" font-size="12.5">• WHERE가 인덱스를 못 타면 : 스캔한 모든 레코드에 락 → 사실상 테이블 전체가 잠긴 효과</text><text x="52" y="670" fill="#7c2d12" font-size="12.5">• FK 검사(①)는 유니크 키를 점 조회하므로 gap 없이 레코드 락 하나로 끝난다</text></svg>