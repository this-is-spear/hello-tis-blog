<svg xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" viewBox="0 0 900 560"><defs><marker id="iBlue" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#2563eb" d="M 0 0 L 10 5 L 0 10 z"/></marker><marker id="iPurple" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#7c3aed" d="M 0 0 L 10 5 L 0 10 z"/></marker><marker id="iGreen" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#16a34a" d="M 0 0 L 10 5 L 0 10 z"/></marker><marker id="iGray" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#6b7280" d="M 0 0 L 10 5 L 0 10 z"/></marker></defs><rect width="900" height="560" x="0" y="0" fill="#fff"/><text x="450" y="34" fill="#111827" font-size="16" font-weight="700" text-anchor="middle">인프라 수준 — 무엇으로 구현하는가</text><rect width="170" height="80" x="40" y="200" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5" rx="8"/><text x="125" y="232" fill="#1e3a5f" font-size="14.5" font-weight="700" text-anchor="middle">주문 서비스</text><text x="125" y="254" fill="#475569" font-size="12" text-anchor="middle">앱 서버</text><rect width="230" height="90" x="300" y="60" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5" rx="8"/><text x="415" y="88" fill="#4c1d95" font-size="14" font-weight="700" text-anchor="middle">Redis — 예약</text><text x="415" y="110" fill="#475569" font-size="12" text-anchor="middle">TTL로 만료 자동화</text><text x="415" y="128" fill="#475569" font-size="12" text-anchor="middle">원장에는 기록하지 않음</text><rect width="270" height="330" x="600" y="60" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" rx="10"/><text x="735" y="88" fill="#334155" font-size="13.5" font-weight="700" text-anchor="middle">MySQL</text><rect width="230" height="100" x="620" y="104" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5" rx="8"/><text x="735" y="128" fill="#1e3a5f" font-size="13" font-weight="700" text-anchor="middle">stock_snapshot</text><text x="636" y="150" fill="#334155" font-family="'SF Mono', Menlo, monospace" font-size="11.5">available_qty · reserved_qty</text><text x="636" y="168" fill="#334155" font-family="'SF Mono', Menlo, monospace" font-size="11.5">last_ledger_id</text><text x="636" y="190" fill="#94a3b8" font-size="11">차감 = 조건부 UPDATE 한 문장</text><rect width="230" height="130" x="620" y="240" fill="#fffbeb" stroke="#d97706" stroke-width="1.5" rx="8"/><text x="735" y="264" fill="#92400e" font-size="13" font-weight="700" text-anchor="middle">stock_ledger</text><text x="636" y="286" fill="#475569" font-size="11.5">reference_id + type 유니크</text><rect width="62" height="20" x="636" y="298" fill="#fef3c7" stroke="#d97706" rx="3"/><text x="667" y="312" fill="#92400e" font-size="10" text-anchor="middle">2026-06</text><rect width="62" height="20" x="702" y="298" fill="#fef3c7" stroke="#d97706" rx="3"/><text x="733" y="312" fill="#92400e" font-size="10" text-anchor="middle">2026-07</text><rect width="62" height="20" x="768" y="298" fill="#fde68a" stroke="#d97706" rx="3"/><text x="799" y="312" fill="#92400e" font-size="10" text-anchor="middle">2026-08</text><text x="636" y="336" fill="#94a3b8" font-size="11">created_at RANGE 파티션</text><text x="636" y="352" fill="#94a3b8" font-size="11">보관 정책: 이월 insert 후 파티션 DROP</text><text x="735" y="384" fill="#b91c1c" font-size="11" text-anchor="middle">두 테이블 사이 FK 없음 — S lock 원천 제거</text><rect width="230" height="100" x="300" y="300" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5" rx="8"/><text x="415" y="326" fill="#14532d" font-size="14" font-weight="700" text-anchor="middle">카프카 — 입고·복원 반영</text><text x="415" y="348" fill="#475569" font-size="12" text-anchor="middle">product_id 파티션 키 (상품 단위 순서)</text><text x="415" y="366" fill="#475569" font-size="12" text-anchor="middle">컨슈머가 스냅샷에 순차 반영</text><text x="415" y="384" fill="#94a3b8" font-size="11" text-anchor="middle">last_ledger_id보다 오래된 이벤트 폐기</text><rect width="230" height="80" x="300" y="450" fill="#f8fafc" stroke="#64748b" stroke-width="1.5" rx="8"/><text x="415" y="476" fill="#334155" font-size="13.5" font-weight="700" text-anchor="middle">배치 서버</text><text x="415" y="496" fill="#475569" font-size="12" text-anchor="middle">대사(재집계·보정) · 보관(이월·정리)</text><text x="415" y="514" fill="#94a3b8" font-size="11" text-anchor="middle">보정량 임계치 초과 시 알림</text><rect width="250" height="80" x="620" y="450" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" rx="8"/><text x="745" y="476" fill="#334155" font-size="13.5" font-weight="700" text-anchor="middle">압축 아카이브</text><text x="745" y="496" fill="#475569" font-size="12" text-anchor="middle">ROW_FORMAT=COMPRESSED 또는 S3</text><text x="745" y="514" fill="#94a3b8" font-size="11" text-anchor="middle">지울 수 없는 구간 이관</text><line x1="210" x2="330" y1="216" y2="150" stroke="#7c3aed" stroke-width="1.8" marker-end="url(#iPurple)"/><text x="240" y="172" fill="#7c3aed" stroke="#fff" stroke-width="5" font-size="12" font-weight="600" paint-order="stroke">예약 · 해제</text><path fill="none" stroke="#2563eb" stroke-width="1.8" marker-end="url(#iBlue)" d="M 210 228 C 400 210, 520 180, 614 154"/><text x="430" y="216" fill="#2563eb" stroke="#fff" stroke-width="5" font-size="12" font-weight="600" paint-order="stroke" text-anchor="middle">조회 SELECT · 차감 트랜잭션 (insert + UPDATE)</text><line x1="210" x2="294" y1="262" y2="322" stroke="#16a34a" stroke-width="1.8" marker-end="url(#iGreen)"/><text x="212" y="304" fill="#16a34a" stroke="#fff" stroke-width="5" font-size="12" font-weight="600" paint-order="stroke">입고·복원 발행</text><path fill="none" stroke="#16a34a" stroke-dasharray="6 4" stroke-width="1.8" marker-end="url(#iGreen)" d="M 530 330 C 570 300, 590 260, 614 190"/><text x="560" y="262" fill="#16a34a" stroke="#fff" stroke-width="5" font-size="12" font-weight="600" paint-order="stroke">반영</text><path fill="none" stroke="#6b7280" stroke-dasharray="5 4" stroke-width="1.6" marker-end="url(#iGray)" d="M 530 470 C 570 440, 590 400, 620 360"/><text x="548" y="426" fill="#6b7280" stroke="#fff" stroke-width="5" font-size="12" font-weight="600" paint-order="stroke">재집계 · 이월</text><line x1="735" x2="740" y1="390" y2="444" stroke="#6b7280" stroke-width="1.6" marker-end="url(#iGray)"/><text x="750" y="422" fill="#6b7280" stroke="#fff" stroke-width="5" font-size="12" font-weight="600" paint-order="stroke">이관</text></svg>