<svg xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" viewBox="0 0 900 480"><defs><marker id="bBlue" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#2563eb" d="M 0 0 L 10 5 L 0 10 z"/></marker><marker id="bPurple" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#7c3aed" d="M 0 0 L 10 5 L 0 10 z"/></marker><marker id="bRed" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#dc2626" d="M 0 0 L 10 5 L 0 10 z"/></marker><marker id="bGreen" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#16a34a" d="M 0 0 L 10 5 L 0 10 z"/></marker><marker id="bGray" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#6b7280" d="M 0 0 L 10 5 L 0 10 z"/></marker></defs><rect width="900" height="480" x="0" y="0" fill="#fff"/><text x="450" y="34" fill="#111827" font-size="16" font-weight="700" text-anchor="middle">비즈니스 로직 수준 — 재고를 무엇으로 다루는가</text><rect width="170" height="80" x="50" y="140" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5" rx="8"/><text x="135" y="172" fill="#1e3a5f" font-size="14.5" font-weight="700" text-anchor="middle">주문</text><text x="135" y="194" fill="#475569" font-size="12" text-anchor="middle">조회 · 예약 · 결제</text><rect width="170" height="80" x="50" y="330" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5" rx="8"/><text x="135" y="362" fill="#14532d" font-size="14.5" font-weight="700" text-anchor="middle">입고 · 운영 조정</text><text x="135" y="384" fill="#475569" font-size="12" text-anchor="middle">늦게 반영돼도 무해</text><rect width="210" height="88" x="360" y="60" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5" rx="8"/><text x="465" y="88" fill="#4c1d95" font-size="14" font-weight="700" text-anchor="middle">예약</text><text x="465" y="110" fill="#475569" font-size="12" text-anchor="middle">결제가 끝날 때까지 잡아둔 재고</text><text x="465" y="128" fill="#475569" font-size="12" text-anchor="middle">일정 시간이 지나면 자동 해제</text><rect width="200" height="96" x="660" y="100" fill="#eff6ff" stroke="#3b82f6" stroke-width="2" rx="8"/><text x="760" y="128" fill="#1e3a5f" font-size="14" font-weight="700" text-anchor="middle">스냅샷</text><text x="760" y="150" fill="#475569" font-size="12" text-anchor="middle">현재 판매 가능 수량</text><text x="760" y="168" fill="#475569" font-size="12" text-anchor="middle">조회와 차감의 기준</text><rect width="200" height="96" x="660" y="330" fill="#fffbeb" stroke="#d97706" stroke-width="2" rx="8"/><text x="760" y="358" fill="#92400e" font-size="14" font-weight="700" text-anchor="middle">원장</text><text x="760" y="380" fill="#475569" font-size="12" text-anchor="middle">모든 변동의 불변 기록</text><text x="760" y="398" fill="#475569" font-size="12" text-anchor="middle">복구 · 정산 · 분쟁의 기준</text><line x1="700" x2="700" y1="330" y2="202" stroke="#16a34a" stroke-dasharray="6 4" stroke-width="1.6" marker-end="url(#bGreen)"/><line x1="822" x2="822" y1="330" y2="202" stroke="#6b7280" stroke-dasharray="4 4" stroke-width="1.4" marker-end="url(#bGray)"/><text x="761" y="250" fill="#6b7280" font-size="11" text-anchor="middle">원장의 요약본</text><text x="761" y="267" fill="#6b7280" font-size="11" text-anchor="middle">언제든 재계산 가능</text><text x="761" y="284" fill="#6b7280" font-size="11" text-anchor="middle">주기 대사로 보정</text><path fill="none" stroke="#2563eb" stroke-width="1.8" marker-end="url(#bBlue)" d="M 220 152 C 400 130, 550 122, 654 130"/><text x="612" y="150" fill="#2563eb" stroke="#fff" stroke-width="5" font-size="12.5" font-weight="600" paint-order="stroke" text-anchor="middle">① 재고 확인</text><line x1="220" x2="354" y1="168" y2="120" stroke="#7c3aed" stroke-width="1.8" marker-end="url(#bPurple)"/><text x="276" y="104" fill="#7c3aed" stroke="#fff" stroke-width="5" font-size="12.5" font-weight="600" paint-order="stroke" text-anchor="middle">② 주문 시작 — 예약</text><path fill="none" stroke="#dc2626" stroke-width="1.8" marker-end="url(#bRed)" d="M 220 196 C 420 220, 560 200, 654 172"/><path fill="none" stroke="#dc2626" stroke-width="1.8" marker-end="url(#bRed)" d="M 220 214 C 400 290, 560 330, 654 352"/><text x="382" y="246" fill="#dc2626" stroke="#fff" stroke-width="5" font-size="12.5" font-weight="600" paint-order="stroke" text-anchor="middle">③ 결제 완료 — 확정 차감</text><text x="398" y="264" fill="#b91c1c" stroke="#fff" stroke-width="5" font-size="11" paint-order="stroke" text-anchor="middle">원장 기록과 스냅샷 차감은 함께 성공하거나 함께 실패</text><path fill="none" stroke="#7c3aed" stroke-dasharray="4 3" stroke-width="1.4" marker-start="url(#bPurple)" d="M 465 148 L 465 196"/><text x="475" y="176" fill="#7c3aed" font-size="11.5">확정되면 예약 해제</text><line x1="220" x2="654" y1="376" y2="380" stroke="#16a34a" stroke-width="1.8" marker-end="url(#bGreen)"/><text x="404" y="366" fill="#16a34a" stroke="#fff" stroke-width="5" font-size="12.5" font-weight="600" paint-order="stroke" text-anchor="middle">④ 원장에 기록만 한다</text><text x="688" y="308" fill="#16a34a" stroke="#fff" stroke-width="5" font-size="12.5" font-weight="600" paint-order="stroke" text-anchor="end">⑤ 스냅샷에는 나중에 반영</text><text x="688" y="326" fill="#16a34a" stroke="#fff" stroke-width="5" font-size="11" paint-order="stroke" text-anchor="end">늦어도 품절로 보일 뿐, 오버셀은 없다</text><text x="450" y="462" fill="#94a3b8" font-size="11.5" text-anchor="middle">오래된 원장 이력은 구간 합산을 남기고 정리한다(보관 정책) — 기술 선택은 인프라 수준 그림에서</text></svg>