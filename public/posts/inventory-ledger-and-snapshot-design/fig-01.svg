<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 600" font-family="-apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <defs>
    <marker id="arrowDark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#374151"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="860" height="600" fill="#ffffff"/>

  <!-- actors -->
  <rect x="55" y="30" width="190" height="52" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="150" y="52" text-anchor="middle" font-size="15" font-weight="700" fill="#1e3a5f">트랜잭션 A</text>
  <text x="150" y="71" text-anchor="middle" font-size="12.5" fill="#475569">상품 42 구매 요청</text>

  <rect x="335" y="30" width="190" height="52" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <text x="430" y="52" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2937">스냅샷 row</text>
  <text x="430" y="71" text-anchor="middle" font-size="12.5" fill="#475569">product_id = 42</text>

  <rect x="615" y="30" width="190" height="52" rx="8" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/>
  <text x="710" y="52" text-anchor="middle" font-size="15" font-weight="700" fill="#14532d">트랜잭션 B</text>
  <text x="710" y="71" text-anchor="middle" font-size="12.5" fill="#475569">상품 42 구매 요청</text>

  <!-- lifelines -->
  <line x1="150" y1="82" x2="150" y2="470" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="430" y1="82" x2="430" y2="470" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="710" y1="82" x2="710" y2="470" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- step 1 : A insert, S lock -->
  <text x="160" y="106" font-size="13.5" fill="#1f2937">① 원장에 insert — FK 검사가</text>
  <text x="160" y="124" font-size="13.5" font-weight="700" fill="#1e40af">스냅샷 row 42에 S lock을 남김</text>
  <line x1="150" y1="132" x2="382" y2="132" stroke="#374151" stroke-width="1.6" marker-end="url(#arrowDark)"/>
  <rect x="388" y="120" width="140" height="24" rx="12" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="458" y="136" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1e40af">S lock (A) — 이 row</text>
  <text x="160" y="152" font-size="11.5" fill="#94a3b8">insert된 row는 원장에, 락은 스냅샷에 남는다</text>

  <!-- step 2 : B insert, S lock -->
  <text x="700" y="170" text-anchor="end" font-size="13.5" fill="#1f2937">② 원장에 insert — FK 검사가</text>
  <text x="700" y="188" text-anchor="end" font-size="13.5" font-weight="700" fill="#166534">같은 스냅샷 row 42에 S lock을 남김</text>
  <line x1="710" y1="196" x2="534" y2="196" stroke="#374151" stroke-width="1.6" marker-end="url(#arrowDark)"/>
  <rect x="388" y="200" width="140" height="24" rx="12" fill="#dcfce7" stroke="#22c55e"/>
  <text x="458" y="216" text-anchor="middle" font-size="12.5" font-weight="600" fill="#166534">S lock (B) — 이 row</text>
  <text x="430" y="244" text-anchor="middle" font-size="12.5" fill="#64748b">같은 row 위에 S lock 두 개 — S lock끼리는 공존 가능이라 여기까지는 통과</text>

  <!-- step 3 : A update attempt -->
  <text x="160" y="262" font-size="13.5" fill="#b91c1c">③ 같은 스냅샷 row 42를 update 시도 — X lock 필요</text>
  <line x1="150" y1="272" x2="382" y2="272" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arrowRed)"/>
  <rect x="388" y="282" width="150" height="24" rx="4" fill="#fef2f2" stroke="#dc2626"/>
  <text x="463" y="298" text-anchor="middle" font-size="12.5" font-weight="600" fill="#b91c1c">대기 : B의 S lock</text>

  <!-- step 4 : B update attempt -->
  <text x="700" y="332" text-anchor="end" font-size="13.5" fill="#b91c1c">④ 같은 스냅샷 row 42를 update 시도 — X lock 필요</text>
  <line x1="710" y1="342" x2="478" y2="342" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arrowRed)"/>
  <rect x="322" y="352" width="150" height="24" rx="4" fill="#fef2f2" stroke="#dc2626"/>
  <text x="397" y="368" text-anchor="middle" font-size="12.5" font-weight="600" fill="#b91c1c">대기 : A의 S lock</text>

  <!-- circular wait -->
  <path d="M 195 410 C 300 382, 560 382, 665 410" fill="none" stroke="#dc2626" stroke-width="1.6" marker-end="url(#arrowRed)"/>
  <path d="M 665 428 C 560 456, 300 456, 195 428" fill="none" stroke="#dc2626" stroke-width="1.6" marker-end="url(#arrowRed)"/>
  <text x="430" y="394" text-anchor="middle" font-size="12.5" fill="#b91c1c" stroke="#ffffff" stroke-width="5" paint-order="stroke">A는 B의 락 해제를 대기</text>
  <text x="430" y="452" text-anchor="middle" font-size="12.5" fill="#b91c1c" stroke="#ffffff" stroke-width="5" paint-order="stroke">B는 A의 락 해제를 대기</text>

  <!-- deadlock box -->
  <rect x="120" y="490" width="620" height="76" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="430" y="521" text-anchor="middle" font-size="15" font-weight="700" fill="#b91c1c">⑤ 순환 대기 성립 — 데드락</text>
  <text x="430" y="546" text-anchor="middle" font-size="13" fill="#7f1d1d">DB가 한쪽을 강제 롤백할 때까지 두 트랜잭션 모두 정지한다</text>
</svg>
