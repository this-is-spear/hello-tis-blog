<svg xmlns="http://www.w3.org/2000/svg" aria-label="socket timeout과 call timeout이 재는 구간 도식" font-family="system-ui, -apple-system, 'Segoe UI', 'Apple SD Gothic Neo', sans-serif" role="img" viewBox="0 0 720 440"><rect width="719" height="439" x=".5" y=".5" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)" rx="8"/><text x="24" y="28" fill="#0b0b0b" font-size="15" font-weight="700">socket timeout과 call timeout이 재는 구간</text><text x="24" y="47" fill="#52514e" font-size="12">같은 HTTP 호출 한 번을 놓고, 타임아웃마다 제한하는 범위가 다르다</text><g fill="#52514e" font-size="11" text-anchor="middle"><text x="86" y="102">풀 대기</text><text x="148" y="102">DNS 조회</text><text x="206" y="102">연결</text><text x="268" y="102">요청 전송</text><text x="350" y="102">서버 처리</text><text x="530" y="102">응답 읽기 — 패킷이 띄엄띄엄 도착</text></g><rect width="60" height="44" x="56" y="110" fill="#efeee8" stroke="#c3c2b7" stroke-width=".5"/><rect width="64" height="44" x="116" y="110" fill="#e1e0d9" stroke="#c3c2b7" stroke-width=".5"/><rect width="52" height="44" x="180" y="110" fill="#efeee8" stroke="#c3c2b7" stroke-width=".5"/><rect width="72" height="44" x="232" y="110" fill="#e1e0d9" stroke="#c3c2b7" stroke-width=".5"/><rect width="92" height="44" x="304" y="110" fill="#efeee8" stroke="#c3c2b7" stroke-width=".5"/><rect width="268" height="44" x="396" y="110" fill="#f6f5ef" stroke="#c3c2b7" stroke-width=".5"/><g fill="#2a78d6"><rect width="5" height="28" x="402" y="118"/><rect width="5" height="28" x="448" y="118"/><rect width="5" height="28" x="502" y="118"/><rect width="5" height="28" x="566" y="118"/><rect width="5" height="28" x="634" y="118"/><rect width="5" height="28" x="652" y="118"/></g><g stroke="#898781" stroke-width="1.4"><line x1="56" x2="116" y1="178" y2="178"/><line x1="56" x2="56" y1="174" y2="182"/><line x1="116" x2="116" y1="174" y2="182"/></g><text x="124" y="182" fill="#52514e" font-size="11.5"><tspan fill="#66655f" font-weight="600">connectionRequestTimeout</tspan> — 풀에서 커넥션을 가져올 때까지 대기 (Apache HttpClient 5)</text><g stroke="#898781" stroke-width="1.4"><line x1="180" x2="232" y1="208" y2="208"/><line x1="180" x2="180" y1="204" y2="212"/><line x1="232" x2="232" y1="204" y2="212"/></g><text x="240" y="212" fill="#52514e" font-size="11.5"><tspan fill="#66655f" font-weight="600">connect timeout</tspan> — 연결이 맺어질 때까지 기다리는 시간</text><g stroke="#eb6834" stroke-width="1.3"><line x1="306" x2="400" y1="240" y2="240"/><line x1="409" x2="446" y1="240" y2="240"/><line x1="455" x2="500" y1="240" y2="240"/><line x1="509" x2="564" y1="240" y2="240"/><line x1="573" x2="632" y1="240" y2="240"/></g><g fill="#eb6834"><path d="M306 240 L313 236.5 L313 243.5 Z"/><path d="M400 240 L393 236.5 L393 243.5 Z"/><path d="M409 240 L416 236.5 L416 243.5 Z"/><path d="M446 240 L439 236.5 L439 243.5 Z"/><path d="M455 240 L462 236.5 L462 243.5 Z"/><path d="M500 240 L493 236.5 L493 243.5 Z"/><path d="M509 240 L516 236.5 L516 243.5 Z"/><path d="M564 240 L557 236.5 L557 243.5 Z"/><path d="M573 240 L580 236.5 L580 243.5 Z"/><path d="M632 240 L625 236.5 L625 243.5 Z"/></g><text x="56" y="266" fill="#52514e" font-size="11.5"><tspan fill="#b14e20" font-weight="600">socket timeout(responseTimeout) · read timeout</tspan> — 패킷 사이 무응답 시간만 잰다.</text><text x="56" y="282" fill="#52514e" font-size="11.5">패킷이 도착할 때마다 0부터 다시 세므로, 패킷이 이어지는 한 전체 시간에는 제한이 없다.</text><text x="116" y="312" fill="#52514e" font-size="11.5"><tspan fill="#1f5fae" font-weight="600">call timeout</tspan> — DNS 조회부터 응답 본문 끝까지 전체를 잰다 (OkHttp, 기본 0 = 무제한)</text><g stroke="#2a78d6" stroke-width="1.4"><line x1="116" x2="664" y1="322" y2="322"/><line x1="116" x2="116" y1="318" y2="326"/><line x1="664" x2="664" y1="318" y2="326"/></g><rect width="608" height="60" x="56" y="352" fill="#f6f5ef" stroke="#e1e0d9" rx="6"/><text x="72" y="377" fill="#0b0b0b" font-size="12">socket timeout이 5초여도 패킷이 4초 간격으로 계속 오면 몇 분짜리 응답도 끊기지 않는다.</text><text x="72" y="397" fill="#52514e" font-size="12">“이 호출은 총 N초 안에 끝나야 한다”는 요구가 있으면 call timeout처럼 전체를 재는 타임아웃이 필요하다.</text></svg>