<svg viewBox="0 0 720 405" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', 'Apple SD Gothic Neo', sans-serif" role="img" aria-label="파드 시작 후 경과일별 RSS 증가분 — arena 기본과 ARENA_MAX=4 비교">
