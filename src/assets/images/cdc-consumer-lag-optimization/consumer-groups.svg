<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" width="880" height="330" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans KR',sans-serif" role="img">
<title>group-id 에 따른 부하분산과 팬아웃</title>
<rect x="0.5" y="0.5" width="879" height="329" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
<text x="30" y="32" font-size="15" font-weight="700" fill="#1e293b">group-id 가 결정하는 두 가지 — 부하분산과 팬아웃</text>
<text x="30" y="52" font-size="11" fill="#64748b">같은 그룹이면 파티션을 나눠 갖고, 다른 그룹이면 전량을 각자 받는다.</text>

<rect x="30" y="76" width="400" height="210" rx="8" fill="#0284c7" fill-opacity="0.05" stroke="#0284c7" stroke-opacity="0.35"/>
<text x="46" y="98" font-size="12" font-weight="700" fill="#0284c7">같은 group-id → 부하분산</text>
<rect x="46" y="112" width="120" height="30" rx="4" fill="#d97706" fill-opacity="0.18"/>
<text x="106" y="132" font-size="10" fill="#1e293b" text-anchor="middle">partition 0</text>
<rect x="176" y="112" width="120" height="30" rx="4" fill="#d97706" fill-opacity="0.18"/>
<text x="236" y="132" font-size="10" fill="#1e293b" text-anchor="middle">partition 1</text>
<rect x="46" y="192" width="120" height="34" rx="4" fill="#059669" fill-opacity="0.18"/>
<text x="106" y="213" font-size="10" fill="#1e293b" text-anchor="middle">app #1</text>
<rect x="176" y="192" width="120" height="34" rx="4" fill="#059669" fill-opacity="0.18"/>
<text x="236" y="213" font-size="10" fill="#1e293b" text-anchor="middle">app #2</text>
<line x1="106" y1="142" x2="106" y2="190" stroke="#94a3b8" stroke-width="1.6"/>
<line x1="236" y1="142" x2="236" y2="190" stroke="#94a3b8" stroke-width="1.6"/>
<text x="46" y="252" font-size="10" fill="#64748b">파티션이 1개면 app #2 는 아무것도 받지 못한다</text>
<text x="46" y="270" font-size="10" fill="#dc2626">→ 우리 구성이 정확히 이 상태 (파티션 1개)</text>

<rect x="450" y="76" width="400" height="210" rx="8" fill="#7c3aed" fill-opacity="0.05" stroke="#7c3aed" stroke-opacity="0.35"/>
<text x="466" y="98" font-size="12" font-weight="700" fill="#7c3aed">다른 group-id → 팬아웃</text>
<rect x="530" y="112" width="240" height="30" rx="4" fill="#d97706" fill-opacity="0.18"/>
<text x="650" y="132" font-size="10" fill="#1e293b" text-anchor="middle">CDC 토픽 (동일 메시지)</text>
<rect x="466" y="192" width="118" height="34" rx="4" fill="#059669" fill-opacity="0.18"/>
<text x="525" y="213" font-size="9.5" fill="#1e293b" text-anchor="middle">hello-cdc-app</text>
<rect x="592" y="192" width="118" height="34" rx="4" fill="#059669" fill-opacity="0.18"/>
<text x="651" y="213" font-size="9.5" fill="#1e293b" text-anchor="middle">감사 로그</text>
<rect x="718" y="192" width="118" height="34" rx="4" fill="#059669" fill-opacity="0.18"/>
<text x="777" y="213" font-size="9.5" fill="#1e293b" text-anchor="middle">캐시 무효화</text>
<line x1="650" y1="142" x2="525" y2="190" stroke="#94a3b8" stroke-width="1.6"/>
<line x1="650" y1="142" x2="651" y2="190" stroke="#94a3b8" stroke-width="1.6"/>
<line x1="650" y1="142" x2="777" y2="190" stroke="#94a3b8" stroke-width="1.6"/>
<text x="466" y="252" font-size="10" fill="#64748b">각 그룹이 오프셋을 독립적으로 관리한다</text>
<text x="466" y="270" font-size="10" fill="#059669">→ producer 는 하나인데 소비자는 얼마든지 늘릴 수 있다</text>

<text x="30" y="316" font-size="10.5" fill="#64748b">CDC 의 실질적 가치가 팬아웃에 있다. 원본 서비스 코드를 건드리지 않고 새 소비자를 붙일 수 있다.</text>
</svg>
