<svg xmlns="http://www.w3.org/2000/svg" width="880" height="336" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans KR',sans-serif" role="img" viewBox="0 0 880 336"><title>단계별 처리량</title><rect width="879" height="335" x=".5" y=".5" fill="#fff" stroke="#e2e8f0" rx="10"/><text x="30" y="30" fill="#1e293b" font-size="15" font-weight="700" text-anchor="start">단계별 최대 처리량과 병목 지점</text><text x="30" y="50" fill="#64748b" font-size="11" font-weight="400" text-anchor="start">뒤 단계가 앞 단계보다 느리면 그 구간에서 처리 대기가 누적된다</text><text x="198" y="96" fill="#1e293b" font-size="12.5" font-weight="600" text-anchor="end">MySQL 쓰기</text><rect width="480" height="30" x="210" y="80" fill="#0284c7" fill-opacity=".85" rx="4"/><text x="700" y="100" fill="#0284c7" font-size="12.5" font-weight="700" text-anchor="start">196,296/s</text><text x="198" y="112" fill="#64748b" font-size="10" font-weight="400" text-anchor="end">저장 프로시저 + 500건마다 커밋</text><text x="216" y="130" fill="#dc2626" font-size="10.5" font-weight="400" text-anchor="start">↓ 129,851/s 만큼 binlog 적재가 앞선다 (Kafka lag 아님)</text><text x="198" y="170" fill="#1e293b" font-size="12.5" font-weight="600" text-anchor="end">Debezium 발행</text><rect width="162.5" height="30" x="210" y="154" fill="#7c3aed" fill-opacity=".85" rx="4"/><text x="382.477" y="174" fill="#7c3aed" font-size="12.5" font-weight="700" text-anchor="start">66,445/s</text><text x="198" y="186" fill="#64748b" font-size="10" font-weight="400" text-anchor="end">binlog 읽기 → Kafka 발행 (순간 최대 97,515/s)</text><text x="216" y="204" fill="#dc2626" font-size="10.5" font-weight="400" text-anchor="start">↓ 36,335/s 만큼 Kafka lag 이 쌓인다</text><text x="198" y="244" fill="#1e293b" font-size="12.5" font-weight="600" text-anchor="end">컨슈머 소비</text><rect width="73.6" height="30" x="210" y="228" fill="#059669" fill-opacity=".85" rx="4"/><text x="293.628" y="248" fill="#059669" font-size="12.5" font-weight="700" text-anchor="start">30,110/s</text><text x="198" y="260" fill="#64748b" font-size="10" font-weight="400" text-anchor="end">파티션 1 · 스레드 1 · 이벤트당 로깅</text></svg>