<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 336" width="880" height="336" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans KR',sans-serif" role="img"><title>단계별 처리량</title><rect x="0.5" y="0.5" width="879" height="335" rx="10" fill="#ffffff" stroke="#e2e8f0"/><text x="30" y="30" font-size="15" fill="#1e293b" text-anchor="start" font-weight="700">단계별 최대 처리량과 병목 지점</text><text x="30" y="50" font-size="11" fill="#64748b" text-anchor="start" font-weight="400">뒤 단계가 앞 단계보다 느리면 그 구간에서 처리 대기가 누적된다</text><text x="198" y="96" font-size="12.5" fill="#1e293b" text-anchor="end" font-weight="600">MySQL 쓰기</text><rect x="210" y="80" width="480.0" height="30" rx="4" fill="#0284c7" fill-opacity="0.85"/><text x="700.0" y="100" font-size="12.5" fill="#0284c7" text-anchor="start" font-weight="700">196,296/s</text><text x="198" y="112" font-size="10" fill="#64748b" text-anchor="end" font-weight="400">저장 프로시저 + 500건마다 커밋</text><text x="216" y="130" font-size="10.5" fill="#dc2626" text-anchor="start" font-weight="400">↓  129,851/s  만큼 binlog 적재가 앞선다 (Kafka lag 아님)</text><text x="198" y="170" font-size="12.5" fill="#1e293b" text-anchor="end" font-weight="600">Debezium 발행</text><rect x="210" y="154" width="162.5" height="30" rx="4" fill="#7c3aed" fill-opacity="0.85"/><text x="382.477075437095" y="174" font-size="12.5" fill="#7c3aed" text-anchor="start" font-weight="700">66,445/s</text><text x="198" y="186" font-size="10" fill="#64748b" text-anchor="end" font-weight="400">binlog 읽기 → Kafka 발행 (순간 최대 97,515/s)</text><text x="216" y="204" font-size="10.5" fill="#dc2626" text-anchor="start" font-weight="400">↓  36,335/s  만큼 Kafka lag 이 쌓인다</text><text x="198" y="244" font-size="12.5" fill="#1e293b" text-anchor="end" font-weight="600">컨슈머 소비</text><rect x="210" y="228" width="73.6" height="30" rx="4" fill="#059669" fill-opacity="0.85"/><text x="293.6275828340873" y="248" font-size="12.5" fill="#059669" text-anchor="start" font-weight="700">30,110/s</text><text x="198" y="260" font-size="10" fill="#64748b" text-anchor="end" font-weight="400">파티션 1 · 스레드 1 · 이벤트당 로깅</text></svg>
