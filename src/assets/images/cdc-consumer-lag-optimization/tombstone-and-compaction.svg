<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 350" width="880" height="350" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans KR',sans-serif" role="img">
<title>DELETE 시 발행되는 두 메시지</title>
<rect x="0.5" y="0.5" width="879" height="349" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
<text x="30" y="32" font-size="15" font-weight="700" fill="#1e293b">DELETE 하나에 메시지는 2개 — tombstone 의 역할</text>
<text x="30" y="52" font-size="11" fill="#64748b">실측: 상품 3번 삭제 시 토픽의 offset 6, 7 에 연달아 기록됨</text>

<rect x="30" y="76" width="400" height="98" rx="8" fill="#dc2626" fill-opacity="0.06" stroke="#dc2626" stroke-opacity="0.4"/>
<text x="46" y="98" font-size="11.5" font-weight="700" fill="#dc2626">offset 6 — 삭제 이벤트</text>
<text x="46" y="120" font-size="10" fill="#1e293b" font-family="ui-monospace,Menlo,monospace">key   = {"id": 3}</text>
<text x="46" y="138" font-size="10" fill="#1e293b" font-family="ui-monospace,Menlo,monospace">value = {"op":"d", "before":{...}, "after":null}</text>
<text x="46" y="160" font-size="10" fill="#64748b">비즈니스 이벤트 — 무엇이 삭제됐는지 before 로 알 수 있다</text>

<rect x="450" y="76" width="400" height="98" rx="8" fill="#64748b" fill-opacity="0.07" stroke="#94a3b8"/>
<text x="466" y="98" font-size="11.5" font-weight="700" fill="#1e293b">offset 7 — tombstone</text>
<text x="466" y="120" font-size="10" fill="#1e293b" font-family="ui-monospace,Menlo,monospace">key   = {"id": 3}</text>
<text x="466" y="138" font-size="10" fill="#1e293b" font-family="ui-monospace,Menlo,monospace">value = null</text>
<text x="466" y="160" font-size="10" fill="#64748b">컴팩션용 삭제 표시 — 처리할 내용이 없으므로 컨슈머는 무시</text>

<!-- 컴팩션 전후 -->
<text x="30" y="206" font-size="12.5" font-weight="700" fill="#1e293b">로그 컴팩션이 하는 일</text>
<rect x="30" y="220" width="390" height="90" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
<text x="46" y="240" font-size="10.5" fill="#64748b">컴팩션 전 (모든 이력)</text>
<text x="46" y="262" font-size="9.5" fill="#1e293b" font-family="ui-monospace,Menlo,monospace">id=1 → {price:29000}</text>
<text x="46" y="278" font-size="9.5" fill="#1e293b" font-family="ui-monospace,Menlo,monospace">id=1 → {price:24900}</text>
<text x="46" y="294" font-size="9.5" fill="#1e293b" font-family="ui-monospace,Menlo,monospace">id=3 → null   (tombstone)</text>

<rect x="450" y="220" width="400" height="90" rx="8" fill="#059669" fill-opacity="0.06" stroke="#059669" stroke-opacity="0.35"/>
<text x="466" y="240" font-size="10.5" fill="#64748b">컴팩션 후 (key 별 최신값만)</text>
<text x="466" y="262" font-size="9.5" fill="#1e293b" font-family="ui-monospace,Menlo,monospace">id=1 → {price:24900}</text>
<text x="466" y="278" font-size="9.5" fill="#059669" font-family="ui-monospace,Menlo,monospace">id=3 → (완전히 제거됨)</text>
<text x="466" y="298" font-size="9.5" fill="#64748b">tombstone 이 없으면 id=3 의 옛 값이 남아 ‘아직 존재’로 읽힌다</text>

<text x="30" y="336" font-size="10.5" fill="#dc2626">컨슈머에서 value==null 체크를 빼면 바로 다음 줄의 JSON 파싱에서 예외가 터진다.</text>
</svg>
