<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" width="880" height="430" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans KR',sans-serif" role="img">
<title>CDC 파이프라인 시스템 구성도. 왼쪽 Spring Boot 앱 박스 안에 ProductService 와 ProductCdcListener 가 들어 있고, 오른쪽으로 MySQL, Debezium, Kafka 가 이어진 뒤 다시 앱으로 돌아온다</title>
<rect x="0.5" y="0.5" width="879" height="429" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
<defs>
  <marker id="ah" markerWidth="9" markerHeight="9" refX="7.5" refY="3.2" orient="auto"><path d="M0,0 L0,6.4 L8.4,3.2 z" fill="#475569"/></marker>
</defs>

<text x="30" y="30" font-size="15" font-weight="700" fill="#1e293b">CDC 파이프라인 시스템 구성</text>
<text x="30" y="50" font-size="11" fill="#64748b">번호 순서대로 데이터가 흐른다. 각 구간에 흐르는 데이터는 아래에 정리했다.</text>

<!-- ===== Spring Boot 앱 ===== -->
<rect x="30" y="76" width="196" height="150" rx="9" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.6"/>
<text x="128" y="95" font-size="9.5" font-weight="700" fill="#94a3b8" text-anchor="middle">Spring Boot 앱</text>

<rect x="44" y="104" width="168" height="52" rx="7" fill="#0284c7" fill-opacity="0.07" stroke="#0284c7" stroke-opacity="0.4"/>
<rect x="56" y="119" width="28" height="21" rx="2.5" fill="none" stroke="#0284c7" stroke-width="1.5"/>
<line x1="56" y1="125" x2="84" y2="125" stroke="#0284c7" stroke-width="1.5"/>
<circle cx="60.5" cy="122" r="1.1" fill="#0284c7"/>
<circle cx="64.5" cy="122" r="1.1" fill="#0284c7"/>
<circle cx="68.5" cy="122" r="1.1" fill="#0284c7"/>
<text x="94" y="126" font-size="10.5" font-weight="700" fill="#0284c7">ProductService</text>
<text x="94" y="142" font-size="9" fill="#64748b">가격·재고를 변경한다</text>

<rect x="44" y="164" width="168" height="52" rx="7" fill="#059669" fill-opacity="0.07" stroke="#059669" stroke-opacity="0.4"/>
<line x1="70" y1="176" x2="70" y2="185.5" stroke="#059669" stroke-width="1.5"/>
<path d="M65 181 L70 186.2 L75 181" fill="none" stroke="#059669" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M58 188 v6 a2.5 2.5 0 0 0 2.5 2.5 h19 a2.5 2.5 0 0 0 2.5 -2.5 v-6 h-6.5 l-2 2.5 h-6 l-2 -2.5 z" fill="none" stroke="#059669" stroke-width="1.5"/>
<text x="94" y="186" font-size="10.5" font-weight="700" fill="#059669">ProductCdcListener</text>
<text x="94" y="202" font-size="9" fill="#64748b">@KafkaListener</text>

<!-- 1 -->
<line x1="230" y1="151" x2="278" y2="151" stroke="#475569" stroke-width="2" marker-end="url(#ah)"/>
<circle cx="254" cy="151" r="10" fill="#ffffff" stroke="#475569" stroke-width="1.5"/>
<text x="254" y="154.8" font-size="10.5" font-weight="700" fill="#475569" text-anchor="middle">1</text>

<!-- ===== MySQL ===== -->
<rect x="282" y="96" width="140" height="110" rx="9" fill="#0f766e" fill-opacity="0.07" stroke="#0f766e" stroke-opacity="0.4"/>
<text x="352" y="115" font-size="9" fill="#94a3b8" text-anchor="middle">데이터베이스</text>
<ellipse cx="352" cy="129" rx="13" ry="5" fill="none" stroke="#0f766e" stroke-width="1.7"/>
<path d="M339 129 V147 A13 5 0 0 0 365 147 V129" fill="none" stroke="#0f766e" stroke-width="1.7"/>
<path d="M339 138 A13 5 0 0 0 365 138" fill="none" stroke="#0f766e" stroke-width="1.4"/>
<text x="352" y="176" font-size="12.5" font-weight="700" fill="#0f766e" text-anchor="middle">MySQL 8.4</text>
<text x="352" y="193" font-size="9.5" fill="#64748b" text-anchor="middle">binlog · ROW 포맷</text>

<!-- 2 -->
<line x1="426" y1="151" x2="474" y2="151" stroke="#475569" stroke-width="2" marker-end="url(#ah)"/>
<circle cx="450" cy="151" r="10" fill="#ffffff" stroke="#475569" stroke-width="1.5"/>
<text x="450" y="154.8" font-size="10.5" font-weight="700" fill="#475569" text-anchor="middle">2</text>

<!-- ===== Debezium ===== -->
<rect x="478" y="96" width="140" height="110" rx="9" fill="#7c3aed" fill-opacity="0.07" stroke="#7c3aed" stroke-opacity="0.4"/>
<text x="548" y="115" font-size="9" fill="#94a3b8" text-anchor="middle">Kafka Connect 커넥터</text>
<rect x="536" y="132" width="24" height="16" rx="3" fill="none" stroke="#7c3aed" stroke-width="1.7"/>
<line x1="542" y1="132" x2="542" y2="124" stroke="#7c3aed" stroke-width="1.7"/>
<line x1="554" y1="132" x2="554" y2="124" stroke="#7c3aed" stroke-width="1.7"/>
<line x1="548" y1="148" x2="548" y2="153" stroke="#7c3aed" stroke-width="1.7"/>
<text x="548" y="176" font-size="12.5" font-weight="700" fill="#7c3aed" text-anchor="middle">Debezium</text>
<text x="548" y="193" font-size="9.5" fill="#64748b" text-anchor="middle">replica 로 등록</text>

<!-- 3 -->
<line x1="622" y1="151" x2="670" y2="151" stroke="#475569" stroke-width="2" marker-end="url(#ah)"/>
<circle cx="646" cy="151" r="10" fill="#ffffff" stroke="#475569" stroke-width="1.5"/>
<text x="646" y="154.8" font-size="10.5" font-weight="700" fill="#475569" text-anchor="middle">3</text>

<!-- ===== Kafka ===== -->
<rect x="674" y="96" width="140" height="110" rx="9" fill="#d97706" fill-opacity="0.07" stroke="#d97706" stroke-opacity="0.4"/>
<text x="744" y="115" font-size="9" fill="#94a3b8" text-anchor="middle">메시지 브로커</text>
<rect x="730" y="125" width="28" height="24" rx="3" fill="none" stroke="#d97706" stroke-width="1.7"/>
<line x1="734" y1="132" x2="752" y2="132" stroke="#d97706" stroke-width="1.7"/>
<line x1="734" y1="137" x2="746" y2="137" stroke="#d97706" stroke-width="1.7"/>
<line x1="734" y1="142" x2="754" y2="142" stroke="#d97706" stroke-width="1.7"/>
<text x="744" y="176" font-size="12.5" font-weight="700" fill="#d97706" text-anchor="middle">Kafka</text>
<text x="744" y="193" font-size="9.5" fill="#64748b" text-anchor="middle">products 토픽</text>

<!-- 4 : Kafka → 리스너 -->
<path d="M744 206 V262 H128 V228" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ah)"/>
<circle cx="436" cy="262" r="10" fill="#ffffff" stroke="#475569" stroke-width="1.5"/>
<text x="436" y="265.8" font-size="10.5" font-weight="700" fill="#475569" text-anchor="middle">4</text>

<!-- 구간별 데이터 -->
<line x1="30" y1="292" x2="850" y2="292" stroke="#e2e8f0" stroke-width="1"/>

<circle cx="40" cy="316.5" r="8.5" fill="#ffffff" stroke="#94a3b8" stroke-width="1.3"/>
<text x="40" y="319.8" font-size="9.5" font-weight="700" fill="#64748b" text-anchor="middle">1</text>
<text x="56" y="320" font-size="10" font-weight="700" fill="#1e293b">SQL 문</text>
<text x="176" y="320" font-size="9.5" fill="#475569" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">UPDATE products SET price=? WHERE id=?</text>
<text x="496" y="320" font-size="9.5" fill="#94a3b8">JPA dirty checking 이 만든 평범한 UPDATE 다.</text>

<circle cx="40" cy="342.5" r="8.5" fill="#ffffff" stroke="#94a3b8" stroke-width="1.3"/>
<text x="40" y="345.8" font-size="9.5" font-weight="700" fill="#64748b" text-anchor="middle">2</text>
<text x="56" y="346" font-size="10" font-weight="700" fill="#1e293b">binlog ROW 이벤트</text>
<text x="176" y="346" font-size="9.5" fill="#475569" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">before: [1, ?, 29000.00, 100, ..]</text>
<text x="496" y="346" font-size="9.5" fill="#dc2626">컬럼 이름과 타입이 없어서 스키마 메타데이터가 있어야 읽는다.</text>

<circle cx="40" cy="368.5" r="8.5" fill="#ffffff" stroke="#94a3b8" stroke-width="1.3"/>
<text x="40" y="371.8" font-size="9.5" font-weight="700" fill="#64748b" text-anchor="middle">3</text>
<text x="56" y="372" font-size="10" font-weight="700" fill="#1e293b">JSON envelope</text>
<text x="176" y="372" font-size="9.5" fill="#475569" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">{"op":"u", "before":{..}, "after":{..}}</text>
<text x="496" y="372" font-size="9.5" fill="#94a3b8">decimal.handling.mode 설정 때문에 price 가 문자열로 온다.</text>

<circle cx="40" cy="394.5" r="8.5" fill="#ffffff" stroke="#94a3b8" stroke-width="1.3"/>
<text x="40" y="397.8" font-size="9.5" font-weight="700" fill="#64748b" text-anchor="middle">4</text>
<text x="56" y="398" font-size="10" font-weight="700" fill="#1e293b">도메인 이벤트</text>
<text x="176" y="398" font-size="9.5" fill="#475569" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">PRICE_CHANGED  29000.00 → 24900.00</text>
<text x="496" y="398" font-size="9.5" fill="#94a3b8">before 와 after 를 비교하는 일은 컨슈머 코드가 한다.</text>
</svg>
