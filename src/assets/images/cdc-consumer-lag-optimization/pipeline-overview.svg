<svg xmlns="http://www.w3.org/2000/svg" width="880" height="430" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans KR',sans-serif" role="img" viewBox="0 0 880 430"><title>CDC 파이프라인 시스템 구성도. 왼쪽 Spring Boot 앱 박스 안에 ProductService 와 ProductCdcListener 가 들어 있고, 오른쪽으로 MySQL, Debezium, Kafka 가 이어진 뒤 다시 앱으로 돌아온다</title><rect width="879" height="429" x=".5" y=".5" fill="#fff" stroke="#e2e8f0" rx="10"/><defs><marker id="ah" markerHeight="9" markerWidth="9" orient="auto" refX="7.5" refY="3.2"><path fill="#475569" d="M0,0 L0,6.4 L8.4,3.2 z"/></marker></defs><text x="30" y="30" fill="#1e293b" font-size="15" font-weight="700">CDC 파이프라인 시스템 구성</text><text x="30" y="50" fill="#64748b" font-size="11">번호 순서대로 데이터가 흐른다. 각 구간에 흐르는 데이터는 아래에 정리했다.</text><rect width="196" height="150" x="30" y="76" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.6" rx="9"/><text x="128" y="95" fill="#94a3b8" font-size="9.5" font-weight="700" text-anchor="middle">Spring Boot 앱</text><rect width="168" height="52" x="44" y="104" fill="#0284c7" fill-opacity=".07" stroke="#0284c7" stroke-opacity=".4" rx="7"/><rect width="28" height="21" x="56" y="119" fill="none" stroke="#0284c7" stroke-width="1.5" rx="2.5"/><line x1="56" x2="84" y1="125" y2="125" stroke="#0284c7" stroke-width="1.5"/><circle cx="60.5" cy="122" r="1.1" fill="#0284c7"/><circle cx="64.5" cy="122" r="1.1" fill="#0284c7"/><circle cx="68.5" cy="122" r="1.1" fill="#0284c7"/><text x="94" y="126" fill="#0284c7" font-size="10.5" font-weight="700">ProductService</text><text x="94" y="142" fill="#64748b" font-size="9">가격·재고를 변경한다</text><rect width="168" height="52" x="44" y="164" fill="#059669" fill-opacity=".07" stroke="#059669" stroke-opacity=".4" rx="7"/><line x1="70" x2="70" y1="176" y2="185.5" stroke="#059669" stroke-width="1.5"/><path fill="none" stroke="#059669" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M65 181 L70 186.2 L75 181"/><path fill="none" stroke="#059669" stroke-width="1.5" d="M58 188 v6 a2.5 2.5 0 0 0 2.5 2.5 h19 a2.5 2.5 0 0 0 2.5 -2.5 v-6 h-6.5 l-2 2.5 h-6 l-2 -2.5 z"/><text x="94" y="186" fill="#059669" font-size="10.5" font-weight="700">ProductCdcListener</text><text x="94" y="202" fill="#64748b" font-size="9">@KafkaListener</text><line x1="230" x2="278" y1="151" y2="151" stroke="#475569" stroke-width="2" marker-end="url(#ah)"/><circle cx="254" cy="151" r="10" fill="#fff" stroke="#475569" stroke-width="1.5"/><text x="254" y="154.8" fill="#475569" font-size="10.5" font-weight="700" text-anchor="middle">1</text><rect width="140" height="110" x="282" y="96" fill="#0f766e" fill-opacity=".07" stroke="#0f766e" stroke-opacity=".4" rx="9"/><text x="352" y="115" fill="#94a3b8" font-size="9" text-anchor="middle">데이터베이스</text><ellipse cx="352" cy="129" fill="none" stroke="#0f766e" stroke-width="1.7" rx="13" ry="5"/><path fill="none" stroke="#0f766e" stroke-width="1.7" d="M339 129 V147 A13 5 0 0 0 365 147 V129"/><path fill="none" stroke="#0f766e" stroke-width="1.4" d="M339 138 A13 5 0 0 0 365 138"/><text x="352" y="176" fill="#0f766e" font-size="12.5" font-weight="700" text-anchor="middle">MySQL 8.4</text><text x="352" y="193" fill="#64748b" font-size="9.5" text-anchor="middle">binlog · ROW 포맷</text><line x1="426" x2="474" y1="151" y2="151" stroke="#475569" stroke-width="2" marker-end="url(#ah)"/><circle cx="450" cy="151" r="10" fill="#fff" stroke="#475569" stroke-width="1.5"/><text x="450" y="154.8" fill="#475569" font-size="10.5" font-weight="700" text-anchor="middle">2</text><rect width="140" height="110" x="478" y="96" fill="#7c3aed" fill-opacity=".07" stroke="#7c3aed" stroke-opacity=".4" rx="9"/><text x="548" y="115" fill="#94a3b8" font-size="9" text-anchor="middle">Kafka Connect 커넥터</text><rect width="24" height="16" x="536" y="132" fill="none" stroke="#7c3aed" stroke-width="1.7" rx="3"/><line x1="542" x2="542" y1="132" y2="124" stroke="#7c3aed" stroke-width="1.7"/><line x1="554" x2="554" y1="132" y2="124" stroke="#7c3aed" stroke-width="1.7"/><line x1="548" x2="548" y1="148" y2="153" stroke="#7c3aed" stroke-width="1.7"/><text x="548" y="176" fill="#7c3aed" font-size="12.5" font-weight="700" text-anchor="middle">Debezium</text><text x="548" y="193" fill="#64748b" font-size="9.5" text-anchor="middle">replica 로 등록</text><line x1="622" x2="670" y1="151" y2="151" stroke="#475569" stroke-width="2" marker-end="url(#ah)"/><circle cx="646" cy="151" r="10" fill="#fff" stroke="#475569" stroke-width="1.5"/><text x="646" y="154.8" fill="#475569" font-size="10.5" font-weight="700" text-anchor="middle">3</text><rect width="140" height="110" x="674" y="96" fill="#d97706" fill-opacity=".07" stroke="#d97706" stroke-opacity=".4" rx="9"/><text x="744" y="115" fill="#94a3b8" font-size="9" text-anchor="middle">메시지 브로커</text><rect width="28" height="24" x="730" y="125" fill="none" stroke="#d97706" stroke-width="1.7" rx="3"/><line x1="734" x2="752" y1="132" y2="132" stroke="#d97706" stroke-width="1.7"/><line x1="734" x2="746" y1="137" y2="137" stroke="#d97706" stroke-width="1.7"/><line x1="734" x2="754" y1="142" y2="142" stroke="#d97706" stroke-width="1.7"/><text x="744" y="176" fill="#d97706" font-size="12.5" font-weight="700" text-anchor="middle">Kafka</text><text x="744" y="193" fill="#64748b" font-size="9.5" text-anchor="middle">products 토픽</text><path fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ah)" d="M744 206 V262 H128 V228"/><circle cx="436" cy="262" r="10" fill="#fff" stroke="#475569" stroke-width="1.5"/><text x="436" y="265.8" fill="#475569" font-size="10.5" font-weight="700" text-anchor="middle">4</text><line x1="30" x2="850" y1="292" y2="292" stroke="#e2e8f0" stroke-width="1"/><circle cx="40" cy="316.5" r="8.5" fill="#fff" stroke="#94a3b8" stroke-width="1.3"/><text x="40" y="319.8" fill="#64748b" font-size="9.5" font-weight="700" text-anchor="middle">1</text><text x="56" y="320" fill="#1e293b" font-size="10" font-weight="700">SQL 문</text><text x="176" y="320" fill="#475569" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="9.5">UPDATE products SET price=? WHERE id=?</text><text x="496" y="320" fill="#94a3b8" font-size="9.5">JPA dirty checking 이 만든 평범한 UPDATE 다.</text><circle cx="40" cy="342.5" r="8.5" fill="#fff" stroke="#94a3b8" stroke-width="1.3"/><text x="40" y="345.8" fill="#64748b" font-size="9.5" font-weight="700" text-anchor="middle">2</text><text x="56" y="346" fill="#1e293b" font-size="10" font-weight="700">binlog ROW 이벤트</text><text x="176" y="346" fill="#475569" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="9.5">before: [1, ?, 29000.00, 100, ..]</text><text x="496" y="346" fill="#dc2626" font-size="9.5">컬럼 이름과 타입이 없어서 스키마 메타데이터가 있어야 읽는다.</text><circle cx="40" cy="368.5" r="8.5" fill="#fff" stroke="#94a3b8" stroke-width="1.3"/><text x="40" y="371.8" fill="#64748b" font-size="9.5" font-weight="700" text-anchor="middle">3</text><text x="56" y="372" fill="#1e293b" font-size="10" font-weight="700">JSON envelope</text><text x="176" y="372" fill="#475569" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="9.5">{&quot;op&quot;:&quot;u&quot;, &quot;before&quot;:{..}, &quot;after&quot;:{..}}</text><text x="496" y="372" fill="#94a3b8" font-size="9.5">decimal.handling.mode 설정 때문에 price 가 문자열로 온다.</text><circle cx="40" cy="394.5" r="8.5" fill="#fff" stroke="#94a3b8" stroke-width="1.3"/><text x="40" y="397.8" fill="#64748b" font-size="9.5" font-weight="700" text-anchor="middle">4</text><text x="56" y="398" fill="#1e293b" font-size="10" font-weight="700">도메인 이벤트</text><text x="176" y="398" fill="#475569" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="9.5">PRICE_CHANGED 29000.00 → 24900.00</text><text x="496" y="398" fill="#94a3b8" font-size="9.5">before 와 after 를 비교하는 일은 컨슈머 코드가 한다.</text></svg>