<svg xmlns="http://www.w3.org/2000/svg" width="880" height="300" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans KR',sans-serif" role="img" viewBox="0 0 880 300"><title>이벤트당 시간 구성</title><rect width="879" height="299" x=".5" y=".5" fill="#fff" stroke="#e2e8f0" rx="10"/><text x="30" y="30" fill="#1e293b" font-size="15" font-weight="700" text-anchor="start">이벤트 1건의 시간 구성 — 총 33.0µs (베이스라인 30,315 event/s)</text><text x="30" y="50" fill="#64748b" font-size="11" font-weight="400" text-anchor="start">왼쪽은 CPU 프로파일로 분해된 구간, 오른쪽 회색은 CPU 프로파일에 나타나지 않는 대기</text><rect width="221.2" height="42" x="30" y="70" fill="#dc2626" fill-opacity=".85"/><text x="140.576" y="96" fill="#fff" font-size="11" font-weight="700" text-anchor="middle">8.9µs</text><rect width="101.9" height="42" x="251.2" y="70" fill="#d97706" fill-opacity=".85"/><text x="302.091" y="96" fill="#fff" font-size="11" font-weight="700" text-anchor="middle">4.1µs</text><rect width="47.2" height="42" x="353" y="70" fill="#0284c7" fill-opacity=".85"/><text x="376.636" y="96" fill="#fff" font-size="11" font-weight="700" text-anchor="middle">1.9µs</text><rect width="24.8" height="42" x="400.2" y="70" fill="#7c3aed" fill-opacity=".85"/><rect width="12.4" height="42" x="425.1" y="70" fill="#059669" fill-opacity=".85"/><rect width="412.5" height="42" x="437.5" y="70" fill="#94a3b8" fill-opacity=".35"/><text x="643.758" y="96" fill="#1e293b" font-size="11.5" font-weight="700" text-anchor="middle">대기 16.5µs</text><rect width="820" height="42" x="30" y="70" fill="none" stroke="#e2e8f0"/><rect width="11" height="11" x="30" y="136" fill="#dc2626" fill-opacity=".85" rx="2"/><text x="48" y="146" fill="#1e293b" font-size="11" font-weight="400" text-anchor="start">JSON 파싱 (jackson)</text><text x="370" y="146" fill="#64748b" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" font-weight="400" text-anchor="end">8.9µs</text><text x="430" y="146" fill="#64748b" font-family="ui-monospace,SFMono-Regul