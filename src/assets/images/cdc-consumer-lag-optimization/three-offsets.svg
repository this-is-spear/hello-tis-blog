<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" width="880" height="360" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans KR',sans-serif" role="img">
<title>오프셋 3종과 lag 의 정의</title>
<rect x="0.5" y="0.5" width="879" height="359" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
<text x="30" y="32" font-size="15" font-weight="700" fill="#1e293b">헷갈리는 ‘오프셋’ 3종 — lag 은 어느 둘의 차이인가</text>
<text x="30" y="52" font-size="11" fill="#64748b">세 값은 저장 위치도 의미도 다르다. 실측 예시는 200만 건 부하 중 한 시점.</text>

<!-- binlog 위치 -->
<rect x="30" y="76" width="255" height="112" rx="8" fill="#0284c7" fill-opacity="0.07" stroke="#0284c7" stroke-opacity="0.4"/>
<text x="46" y="98" font-size="11.5" font-weight="700" fill="#0284c7">① binlog 위치</text>
<text x="46" y="117" font-size="10" fill="#64748b">Debezium 이 binlog 를 어디까지 읽었나</text>
<text x="46" y="137" font-size="10" fill="#1e293b" font-family="ui-monospace,Menlo,monospace">binlog.000002 : 4878250</text>
<text x="46" y="160" font-size="9.5" fill="#64748b">저장: connect_offsets 토픽</text>
<text x="46" y="176" font-size="9.5" fill="#64748b">Connect 재시작 시 여기서 재개</text>

<!-- log-end -->
<rect x="312" y="76" width="255" height="112" rx="8" fill="#d97706" fill-opacity="0.07" stroke="#d97706" stroke-opacity="0.4"/>
<text x="328" y="98" font-size="11.5" font-weight="700" fill="#d97706">② log-end-offset</text>
<text x="328" y="117" font-size="10" fill="#64748b">토픽에 쌓인 마지막 메시지 위치</text>
<text x="328" y="137" font-size="10" fill="#1e293b" font-family="ui-monospace,Menlo,monospace">1,995,436</text>
<text x="328" y="160" font-size="9.5" fill="#64748b">저장: 토픽 자체 (파티션의 끝)</text>
<text x="328" y="176" font-size="9.5" fill="#64748b">Debezium 이 발행할수록 증가</text>

<!-- committed -->
<rect x="594" y="76" width="256" height="112" rx="8" fill="#059669" fill-opacity="0.07" stroke="#059669" stroke-opacity="0.4"/>
<text x="610" y="98" font-size="11.5" font-weight="700" fill="#059669">③ current(committed)-offset</text>
<text x="610" y="117" font-size="10" fill="#64748b">컨슈머 그룹이 처리 완료한 위치</text>
<text x="610" y="137" font-size="10" fill="#1e293b" font-family="ui-monospace,Menlo,monospace">839,436</text>
<text x="610" y="160" font-size="9.5" fill="#64748b">저장: __consumer_offsets 토픽</text>
<text x="610" y="176" font-size="9.5" fill="#64748b">컨슈머가 죽어도 남는다</text>

<!-- lag 정의 -->
<rect x="30" y="212" width="820" height="76" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
<text x="48" y="238" font-size="12.5" font-weight="700" fill="#1e293b">lag = ② log-end-offset − ③ committed-offset</text>
<text x="48" y="262" font-size="11" fill="#1e293b" font-family="ui-monospace,Menlo,monospace">1,995,436 − 839,436 = 1,156,000</text>
<text x="330" y="262" font-size="11" fill="#64748b">← 이 시점의 최고 lag</text>
<text x="48" y="280" font-size="10" fill="#dc2626">①은 lag 에 포함되지 않는다 → MySQL↔Debezium 구간의 지연은 별도 지표(MilliSecondsBehindSource)로 봐야 한다</text>

<text x="30" y="318" font-size="11" fill="#64748b">컨슈머가 없어도 ③은 유지되므로 lag 조회는 성공한다. ‘살아있는지’는 CONSUMER-ID / Members 로 판단할 것.</text>
<text x="30" y="340" font-size="11" fill="#64748b">auto-offset-reset 은 ③이 아예 없을 때만 적용되는 폴백이다 (earliest = 토픽 처음부터).</text>
</svg>
