<svg viewBox="0 0 720 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', 'Apple SD Gothic Neo', sans-serif" role="img" aria-label="Top Chunk Pinning 도식">
  <rect x="0.5" y="0.5" width="719" height="299" rx="8" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)"/>

  <text x="24" y="28" font-size="15" font-weight="700" fill="#0b0b0b">Top Chunk Pinning</text>
  <text x="24" y="47" font-size="12" fill="#52514e">glibc는 힙 꼭대기부터 연속된 빈 공간만 OS에 반환한다</text>

  <!-- legend -->
  <g font-size="12" fill="#52514e">
    <rect x="580" y="17" width="10" height="10" rx="2" fill="#2a78d6"/>
    <text x="595" y="26">live</text>
    <rect x="636" y="17" width="10" height="10" rx="2" fill="#e1e0d9"/>
    <text x="651" y="26">free</text>
  </g>

  <!-- address direction -->
  <text x="56" y="105" font-size="11" fill="#898781">낮은 주소</text>
  <text x="664" y="105" font-size="11" fill="#898781" text-anchor="end">높은 주소 · 힙 꼭대기</text>

  <!-- OS return direction arrow -->
  <line x1="664" y1="84" x2="566" y2="84" stroke="#898781" stroke-width="1"/>
  <path d="M566 84 L574 80 L574 88 Z" fill="#898781"/>
  <text x="558" y="88" font-size="11" fill="#898781" text-anchor="end">OS 반환 방향</text>

  <!-- heap bar -->
  <rect x="56" y="120" width="84" height="56" fill="#2a78d6"/>
  <rect x="142" y="120" width="58" height="56" fill="#e1e0d9"/>
  <rect x="202" y="120" width="82" height="56" fill="#2a78d6"/>
  <rect x="286" y="120" width="302" height="56" fill="#e1e0d9"/>
  <rect x="590" y="120" width="74" height="56" fill="#eb6834"/>

  <g font-size="12" text-anchor="middle">
    <text x="98" y="152" fill="#ffffff">live</text>
    <text x="171" y="152" fill="#52514e">free</text>
    <text x="243" y="152" fill="#ffffff">live</text>
    <text x="437" y="152" fill="#52514e">free — 큰 빈 공간</text>
    <text x="627" y="152" fill="#ffffff">live</text>
  </g>

  <!-- annotations -->
  <line x1="627" y1="176" x2="627" y2="206" stroke="#c3c2b7" stroke-width="1"/>
  <text x="664" y="222" font-size="11" fill="#52514e" text-anchor="end">꼭대기에 남은 live 할당 하나가 반환을 막는다</text>

  <line x1="437" y1="176" x2="437" y2="240" stroke="#c3c2b7" stroke-width="1"/>
  <text x="437" y="256" font-size="11" fill="#52514e" text-anchor="middle">free지만 꼭대기가 막혀 OS로 못 돌아간다 — RSS에 남는다</text>
</svg>
