<svg viewBox="0 0 720 405" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', 'Apple SD Gothic Neo', sans-serif" role="img" aria-label="glibc 기본과 ARENA_MAX=2의 라운드별 격차 추이">
  <rect x="0.5" y="0.5" width="719" height="404" rx="8" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)"/>

  <text x="24" y="28" font-size="15" font-weight="700" fill="#0b0b0b">격차 추이 — glibc 기본 vs ARENA_MAX=2</text>
  <text x="24" y="47" font-size="12" fill="#52514e">격차 = RSS − NMT committed · 단위 MB</text>

  <!-- legend -->
  <g font-size="12" fill="#52514e">
    <circle cx="500" cy="24" r="4" fill="#2a78d6"/>
    <text x="510" y="28">glibc 기본</text>
    <circle cx="596" cy="24" r="4" fill="#eb6834"/>
    <text x="606" y="28">ARENA_MAX=2</text>
  </g>

  <!-- gridlines -->
  <g stroke="#e1e0d9" stroke-width="1">
    <line x1="56" y1="72" x2="590" y2="72"/>
    <line x1="56" y1="168" x2="590" y2="168"/>
    <line x1="56" y1="264" x2="590" y2="264"/>
  </g>
  <line x1="56" y1="360" x2="590" y2="360" stroke="#c3c2b7" stroke-width="1"/>

  <!-- y labels -->
  <g font-size="11" fill="#898781" text-anchor="end">
    <text x="48" y="364">0</text>
    <text x="48" y="268">100</text>
    <text x="48" y="172">200</text>
    <text x="48" y="76">300</text>
  </g>

  <!-- x labels -->
  <g font-size="11" fill="#898781" text-anchor="middle">
    <text x="56" y="378">부하 전</text>
    <text x="162.8" y="378">1</text>
    <text x="269.6" y="378">2</text>
    <text x="376.4" y="378">3</text>
    <text x="483.2" y="378">4</text>
    <text x="590" y="378">5</text>
  </g>
  <text x="323" y="396" font-size="11" fill="#898781" text-anchor="middle">부하 라운드</text>

  <!-- glibc 기본 (blue) -->
  <polyline points="56,313.92 162.8,243.84 269.6,178.56 376.4,142.08 483.2,115.2 590,96" fill="none" stroke="#2a78d6" stroke-width="2"/>
  <g fill="#2a78d6" stroke="#fcfcfb" stroke-width="2">
    <circle cx="56" cy="313.92" r="4"/>
    <circle cx="162.8" cy="243.84" r="4"/>
    <circle cx="269.6" cy="178.56" r="4"/>
    <circle cx="376.4" cy="142.08" r="4"/>
    <circle cx="483.2" cy="115.2" r="4"/>
    <circle cx="590" cy="96" r="4"/>
  </g>

  <!-- ARENA_MAX=2 (orange) -->
  <polyline points="56,316.8 162.8,320.64 269.6,288 376.4,311.04 483.2,296.64 590,293.76" fill="none" stroke="#eb6834" stroke-width="2"/>
  <g fill="#eb6834" stroke="#fcfcfb" stroke-width="2">
    <circle cx="56" cy="316.8" r="4"/>
    <circle cx="162.8" cy="320.64" r="4"/>
    <circle cx="269.6" cy="288" r="4"/>
    <circle cx="376.4" cy="311.04" r="4"/>
    <circle cx="483.2" cy="296.64" r="4"/>
    <circle cx="590" cy="293.76" r="4"/>
  </g>

  <!-- end labels -->
  <g font-size="12" fill="#52514e">
    <text x="600" y="100" font-weight="700">275MB</text>
    <text x="600" y="115" font-size="11" fill="#898781">계속 증가</text>
    <text x="600" y="297" font-weight="700">69MB</text>
    <text x="600" y="312" font-size="11" fill="#898781">제자리</text>
  </g>
</svg>
