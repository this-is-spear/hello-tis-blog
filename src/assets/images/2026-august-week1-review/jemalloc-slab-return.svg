<svg xmlns="http://www.w3.org/2000/svg" aria-label="jemalloc의 크기 등급 slab과 madvise 반환 도식" font-family="system-ui, -apple-system, 'Segoe UI', 'Apple SD Gothic Neo', sans-serif" role="img" viewBox="0 0 720 300"><rect width="719" height="299" x=".5" y=".5" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)" rx="8"/><text x="24" y="28" fill="#0b0b0b" font-size="15" font-weight="700">jemalloc — 같은 배치인데 반환이 된다</text><text x="24" y="47" fill="#52514e" font-size="12">크기 등급(size class)별 slab · 빈 페이지는 madvise로 즉시 OS 반환</text><g fill="#52514e" font-size="12"><rect width="10" height="10" x="530" y="17" fill="#2a78d6" rx="2"/><text x="545" y="26">live</text><rect width="10" height="10" x="586" y="17" fill="#fcfcfb" stroke="#c3c2b7" stroke-dasharray="3 2" rx="2"/><text x="601" y="26">free — 반환됨</text></g><text x="56" y="105" fill="#898781" font-size="11">낮은 주소</text><text x="664" y="105" fill="#898781" font-size="11" text-anchor="end">높은 주소 · 힙 꼭대기</text><rect width="84" height="56" x="56" y="120" fill="#2a78d6"/><rect width="58" height="56" x="142" y="120" fill="#fcfcfb" stroke="#c3c2b7" stroke-dasharray="4 3"/><rect width="82" height="56" x="202" y="120" fill="#2a78d6"/><rect width="302" height="56" x="286" y="120" fill="#fcfcfb" stroke="#c3c2b7" stroke-dasharray="4 3"/><rect width="74" height="56" x="590" y="120" fill="#eb6834"/><g stroke="#fcfcfb" stroke-width="2"><line x1="77" x2="77" y1="120" y2="176"/><line x1="98" x2="98" y1="120" y2="176"/><line x1="119" x2="119" y1="120" y2="176"/><line x1="222" x2="222" y1="120" y2="176"/><line x1="243" x2="243" y1="120" y2="176"/><line x1="264" x2="264" y1="120" y2="176"/></g><g font-size="12" text-anchor="middle"><text x="98" y="152" fill="#fff">live slab</text><text x="171" y="152" fill="#898781">반환됨</text><text x="437" y="152" fill="#898781">free — madvise로 OS 반환 (RSS에서 빠짐)</text><text x="243" y="152" fill="#fff">live slab</text><text x="627" y="152" fill="#fff">live</text></g><line x1="98" x2="98" y1="176" y2="206" stroke="#c3c2b7" stroke-width="1"/><text x="56" y="222" fill="#52514e" font-size="11">한 slab엔 같은 크기 객체만 모인다</text><line x1="627" x2="627" y1="176" y2="206" stroke="#c3c2b7" stroke-width="1"/><text x="664" y="222" fill="#52514e" font-size="11" text-anchor="end">꼭대기에 live가 남아 있어도</text><line x1="437" x2="437" y1="176" y2="240" stroke="#c3c2b7" stroke-width="1"/><text x="437" y="256" fill="#52514e" font-size="11" text-anchor="middle">빈 페이지는 위치와 무관하게 OS로 돌아간다</text></svg>