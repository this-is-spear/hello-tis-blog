<svg viewBox="0 0 720 300" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', 'Apple SD Gothic Neo', sans-serif" role="img" aria-label="jemalloc의 크기 등급 slab과 madvise 반환 도식">
  <rect x="0.5" y="0.5" width="719" height="299" rx="8" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)"/>

  <text x="24" y="28" font-size="15" font-weight="700" fill="#0b0b0b">jemalloc — 같은 배치인데 반환이 된다</text>
  <text x="24" y="47" font-size="12" fill="#52514e">크기 등급(size class)별 slab · 빈 페이지는 madvise로 즉시 OS 반환</text>

  <!-- legend -->
  <g font-size="12" fill="#52514e">
    <rect x="530" y="17" width="10" height="10" rx="2" fill="#2a78d6"/>
    <text x="545" y="26">live</text>
    <rect x="586" y="17" width="10" height="10" rx="2" fill="#fcfcfb" stroke="#c3c2b7" stroke-dasharray="3 2"/>
    <text x="601" y="26">free — 반환됨</text>
  </g>

  <!-- address direction -->
  <text x="56" y="105" font-size="11" fill="#898781">낮은 주소</text>
  <text x="664" y="105" font-size="11" fill="#898781" text-anchor="end">높은 주소 · 힙 꼭대기</text>

  <!-- heap bar: same layout as the pinning diagram -->
  <rect x="56" y="120" width="84" height="56" fill="#2a78d6"/>
  <rect x="142" y="120" width="58" height="56" fill="#fcfcfb" stroke="#c3c2b7" stroke-dasharray="4 3"/>
  <rect x="202" y="120" width="82" height="56" fill="#2a78d6"/>
  <rect x="286" y="120" width="302" height="56" fill="#fcfcfb" stroke="#c3c2b7" stroke-dasharray="4 3"/>
  <rect x="590" y="120" width="74" height="56" fill="#eb6834"/>

  <!-- same-size cell dividers inside live slabs -->
  <g stroke="#fcfcfb" stroke-width="2">
    <line x1="77" y1="120" x2="77" y2="176"/>
    <line x1="98" y1="120" x2="98" y2="176"/>
    <line x1="119" y1="120" x2="119" y2="176"/>
    <line x1="222" y1="120" x2="222" y2="176"/>
    <line x1="243" y1="120" x2="243" y2="176"/>
    <line x1="264" y1="120" x2="264" y2="176"/>
  </g>

  <g font-size="12" text-anchor="middle">
    <text x="98" y="152" fill="#ffffff">live slab</text>
    <text x="171" y="152" fill="#898781">반환됨</text>
    <text x="437" y="152" fill="#898781">free — madvise로 OS 반환 (RSS에서 빠짐)</text>
    <text x="243" y="152" fill="#ffffff">live slab</text>
    <text x="627" y="152" fill="#ffffff">live</text>
  </g>

  <!-- annotations -->
  <line x1="98" y1="176" x2="98" y2="206" stroke="#c3c2b7" stroke-width="1"/>
  <text x="56" y="222" font-size="11" fill="#52514e">한 slab엔 같은 크기 객체만 모인다</text>

  <line x1="627" y1="176" x2="627" y2="206" stroke="#c3c2b7" stroke-width="1"/>
  <text x="664" y="222" font-size="11" fill="#52514e" text-anchor="end">꼭대기에 live가 남아 있어도</text>

  <line x1="437" y1="176" x2="437" y2="240" stroke="#c3c2b7" stroke-width="1"/>
  <text x="437" y="256" font-size="11" fill="#52514e" text-anchor="middle">빈 페이지는 위치와 무관하게 OS로 돌아간다</text>
</svg>
