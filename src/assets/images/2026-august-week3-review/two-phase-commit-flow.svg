<svg xmlns="http://www.w3.org/2000/svg" aria-label="2PC 커밋 한 번의 흐름 도식" font-family="system-ui, -apple-system, 'Segoe UI', 'Apple SD Gothic Neo', sans-serif" role="img" viewBox="0 0 720 520"><rect width="719" height="519" x=".5" y=".5" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)" rx="8"/><defs><marker id="ah" markerHeight="8" markerWidth="8" orient="auto" refX="7" refY="4"><path fill="#0b0b0b" d="M0,0 L8,4 L0,8 z"/></marker><marker id="ah-muted" markerHeight="8" markerWidth="8" orient="auto" refX="7" refY="4"><path fill="#52514e" d="M0,0 L8,4 L0,8 z"/></marker></defs><text x="24" y="28" fill="#0b0b0b" font-size="15" font-weight="700">2PC 한 번의 커밋이 지나는 길</text><text x="24" y="47" fill="#52514e" font-size="12">prepare와 commit 두 라운드 동안 네트워크 왕복, 디스크 기록, 잠금 대기가 쌓인다</text><g fill="#0b0b0b" font-size="12" font-weight="700" text-anchor="middle"><rect width="116" height="26" x="92" y="70" fill="#efeee8" stroke="#c3c2b7" stroke-width=".8" rx="4"/><text x="150" y="87">코디네이터</text><rect width="116" height="26" x="377" y="70" fill="#efeee8" stroke="#c3c2b7" stroke-width=".8" rx="4"/><text x="435" y="87">참여자 A (DB)</text><rect width="116" height="26" x="577" y="70" fill="#efeee8" stroke="#c3c2b7" stroke-width=".8" rx="4"/><text x="635" y="87">참여자 B (브로커)</text></g><g stroke="#c3c2b7" stroke-dasharray="3 4" stroke-width="1"><line x1="150" x2="150" y1="96" y2="428"/><line x1="435" x2="435" y1="96" y2="428"/><line x1="635" x2="635" y1="96" y2="428"/></g><g stroke="#898781" stroke-width="1.2"><line x1="36" x2="36" y1="112" y2="230"/><line x1="36" x2="42" y1="112" y2="112"/><line x1="36" x2="42" y1="230" y2="230"/><line x1="36" x2="36" y1="252" y2="416"/><line x1="36" x2="42" y1="252" y2="252"/><line x1="36" x2="42" y1="416" y2="416"/></g><g fill="#52514e" font-size="11"><text x="46" y="124">1라운드</text><text x="46" y="139">prepare</text><text x="46" y="264">2라운드</text><text x="46" y="279">commit</text></g><rect width="80" height="132" x="395" y="212" fill="#f4ead8" stroke="#d8c9a8" stroke-width=".8" rx="4"/><rect width="80" height="132" x="595" y="212" fill="#f4ead8" stroke="#d8c9a8" stroke-width=".8" rx="4"/><g fill="#7a5c1e" font-size="11" text-anchor="middle"><text x="535" y="248">in-doubt</text><text x="535" y="263">잠금을 쥔 채</text><text x="535" y="278">commit 지시 대기</text></g><g stroke="#0b0b0b" stroke-width="1.2"><line x1="150" x2="428" y1="124" y2="124" marker-end="url(#ah)"/><line x1="150" x2="628" y1="138" y2="138" marker-end="url(#ah)"/></g><text x="200" y="118" fill="#0b0b0b" font-size="11">prepare</text><g fill="#1f4e8c" font-size="10.5" text-anchor="middle"><rect width="120" height="20" x="375" y="152" fill="#e3edf9" stroke="#9dbde4" stroke-width=".8" rx="4"/><text x="435" y="166">prepare 기록 · fsync</text><rect width="120" height="20" x="575" y="152" fill="#e3edf9" stroke="#9dbde4" stroke-width=".8" rx="4"/><text x="635" y="166">prepare 기록 · fsync</text></g><g stroke="#52514e" stroke-dasharray="4 3" stroke-width="1.2"><line x1="435" x2="157" y1="192" y2="192" marker-end="url(#ah-muted)"/><line x1="635" x2="157" y1="206" y2="206" marker-end="url(#ah-muted)"/></g><text x="200" y="186" fill="#52514e" font-size="11">예 (동의)</text><g fill="#1f4e8c" font-size="10.5" text-anchor="middle"><rect width="120" height="20" x="90" y="232" fill="#e3edf9" stroke="#9dbde4" stroke-width=".8" rx="4"/><text x="150" y="246">결정 기록 · fsync</text></g><g stroke="#0b0b0b" stroke-width="1.2"><line x1="150" x2="428" y1="284" y2="284" marker-end="url(#ah)"/><line x1="150" x2="628" y1="298" y2="298" marker-end="url(#ah)"/></g><text x="200" y="278" fill="#0b0b0b" font-size="11">commit</text><g fill="#1f4e8c" font-size="10.5" text-anchor="middle"><rect width="120" height="20" x="375" y="314" fill="#e3edf9" stroke="#9dbde4" stroke-width=".8" rx="4"/><text x="435" y="328">commit 기록 · fsync</text><rect width="120" height="20" x="575" y="314" fill="#e3edf9" stroke="#9dbde4" stroke-width=".8" rx="4"/><text x="635" y="328">commit 기록 · fsync</text></g><g fill="#52514e" font-size="10.5" text-anchor="middle"><text x="435" y="360">잠금 해제</text><text x="635" y="360">잠금 해제</text></g><g stroke="#52514e" stroke-dasharray="4 3" stroke-width="1.2"><line x1="435" x2="157" y1="388" y2="388" marker-end="url(#ah-muted)"/><line x1="635" x2="157" y1="402" y2="402" marker-end="url(#ah-muted)"/></g><text x="200" y="382" fill="#52514e" font-size="11">완료</text><line x1="24" x2="696" y1="444" y2="444" stroke="rgba(11,11,11,0.10)"/><text x="24" y="468" fill="#0b0b0b" font-size="12" font-weight="700">커밋 한 번의 비용</text><text x="24" y="488" fill="#52514e" font-size="12">네트워크 왕복 2회 · 디스크 기록 5회(참여자 2회씩 + 코디네이터 1회) · 참여자는 in-doubt 동안 잠금 유지</text></svg>