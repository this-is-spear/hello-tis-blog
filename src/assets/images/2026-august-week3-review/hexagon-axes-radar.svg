<svg viewBox="0 0 560 400" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', 'Apple SD Gothic Neo', sans-serif" role="img" aria-label="육각형 여섯 축에 오픈소스 기여를 상중하로 매긴 레이더 그래프">
  <rect x="0.5" y="0.5" width="559" height="399" rx="8" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)"/>

  <!-- 등급 링: 하 40 / 중 80 / 상 120 -->
  <polygon points="280,160 314.6,180 314.6,220 280,240 245.4,220 245.4,180" fill="none" stroke="rgba(11,11,11,0.10)"/>
  <polygon points="280,120 349.3,160 349.3,240 280,280 210.7,240 210.7,160" fill="none" stroke="rgba(11,11,11,0.10)"/>
  <polygon points="280,80 383.9,140 383.9,260 280,320 176.1,260 176.1,140" fill="none" stroke="rgba(11,11,11,0.18)"/>

  <!-- 축선 -->
  <g stroke="rgba(11,11,11,0.07)">
    <line x1="280" y1="200" x2="280" y2="80"/><line x1="280" y1="200" x2="383.9" y2="140"/>
    <line x1="280" y1="200" x2="383.9" y2="260"/><line x1="280" y1="200" x2="280" y2="320"/>
    <line x1="280" y1="200" x2="176.1" y2="260"/><line x1="280" y1="200" x2="176.1" y2="140"/>
  </g>

  <!-- 실제 등급: 상,상,상,중,중,하 -->
  <polygon points="280,80 383.9,140 383.9,260 280,280 210.7,240 245.4,180" fill="rgba(37,99,235,0.14)" stroke="#2563eb" stroke-width="2"/>
  <g fill="#2563eb">
    <circle cx="280" cy="80" r="4"/><circle cx="383.9" cy="140" r="4"/><circle cx="383.9" cy="260" r="4"/>
    <circle cx="280" cy="280" r="4"/><circle cx="210.7" cy="240" r="4"/><circle cx="245.4" cy="180" r="4"/>
  </g>

  <!-- 축 이름 -->
  <g font-size="13" fill="#0b0b0b">
    <text x="280" y="62" text-anchor="middle">구현 기술 <tspan fill="#2563eb" font-weight="600">상</tspan></text>
    <text x="392" y="134" text-anchor="start">품질 · 코드 이해 <tspan fill="#2563eb" font-weight="600">상</tspan></text>
    <text x="392" y="272" text-anchor="start">리팩터링 · 테스트 <tspan fill="#2563eb" font-weight="600">상</tspan></text>
    <text x="280" y="344" text-anchor="middle">응집도 · 결합도 <tspan font-weight="600">중</tspan></text>
    <text x="168" y="272" text-anchor="end">아키텍처 · 패턴 <tspan font-weight="600">중</tspan></text>
    <text x="168" y="134" text-anchor="end" fill="#52514e">업무 관리 · 공유 <tspan font-weight="600">하</tspan></text>
  </g>

  <text x="280" y="378" text-anchor="middle" font-size="12" fill="#52514e">상: 머지 기록으로 증명 · 중: 기여하면서 배움 · 하: 오픈소스로 드러나기 어려움</text>
</svg>
