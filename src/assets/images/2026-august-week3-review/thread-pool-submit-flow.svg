<svg xmlns="http://www.w3.org/2000/svg" aria-label="스레드 풀에서 요청이 실행되는 과정 도식 — 동작은 실선, 각 단계에서 발생하는 문제는 점선으로 표시" font-family="system-ui, -apple-system, 'Segoe UI', 'Apple SD Gothic Neo', sans-serif" role="img" viewBox="0 0 720 540"><rect width="719" height="539" x=".5" y=".5" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)" rx="8"/><defs><marker id="wf-ah" markerHeight="8" markerWidth="8" orient="auto" refX="7" refY="4"><path fill="#0b0b0b" d="M0,0 L8,4 L0,8 z"/></marker><marker id="wf-ah-muted" markerHeight="8" markerWidth="8" orient="auto" refX="7" refY="4"><path fill="#52514e" d="M0,0 L8,4 L0,8 z"/></marker></defs><text x="24" y="28" fill="#0b0b0b" font-size="15" font-weight="700">스레드 풀에서 요청이 실행되는 과정</text><circle cx="110" cy="140" r="50" fill="#efeee8" stroke="#c3c2b7"/><text x="110" y="137" fill="#0b0b0b" font-size="12" font-weight="700" text-anchor="middle">요청</text><text x="110" y="154" fill="#52514e" font-size="10.5" text-anchor="middle">(제출자)</text><circle cx="610" cy="140" r="50" fill="#efeee8" stroke="#c3c2b7"/><text x="610" y="137" fill="#0b0b0b" font-size="12" font-weight="700" text-anchor="middle">워커 스레드</text><text x="610" y="154" fill="#52514e" font-size="10.5" text-anchor="middle">(실행자)</text><circle cx="360" cy="440" r="70" fill="#efeee8" stroke="#c3c2b7"/><text x="360" y="437" fill="#0b0b0b" font-size="12" font-weight="700" text-anchor="middle">스레드 풀</text><text x="360" y="454" fill="#52514e" font-size="10.5" text-anchor="middle">(스레드 관리자)</text><rect width="140" height="52" x="200" y="250" fill="#e1e0d9" stroke="#c3c2b7" rx="4"/><line x1="235" x2="235" y1="250" y2="302" stroke="#c3c2b7" stroke-width=".8"/><line x1="270" x2="270" y1="250" y2="302" stroke="#c3c2b7" stroke-width=".8"/><line x1="305" x2="305" y1="250" y2="302" stroke="#c3c2b7" stroke-width=".8"/><text x="290" y="240" fill="#0b0b0b" font-size="12" font-weight="700" text-anchor="middle">큐 (대기 작업 보관)</text><path fill="none" stroke="#0b0b0b" stroke-width="1.2" marker-end="url(#wf-ah)" d="M110,192 L110,440 L284,440"/><text x="120" y="338" fill="#0b0b0b" font-size="11">1-1 작업 제출</text><path fill="none" stroke="#52514e" stroke-dasharray="4 3" stroke-width="1.2" marker-end="url(#wf-ah-muted)" d="M300,480 L48,480 L48,140 L56,140"/><text x="54" y="472" fill="#52514e" font-size="11">1-2 모두 가득이면 거부</text><path fill="none" stroke="#0b0b0b" stroke-width="1.2" marker-end="url(#wf-ah)" d="M414,384 L490,384 L490,150 L558,150"/><text x="498" y="212" fill="#0b0b0b" font-size="11">2-1 여유 스레드에 위임</text><path fill="none" stroke="#52514e" stroke-dasharray="4 3" stroke-width="1.2" marker-end="url(#wf-ah-muted)" d="M503,312 L492,312"/><text x="509" y="316" fill="#52514e" font-size="11">2-2 ThreadLocal 미전파</text><path fill="none" stroke="#0b0b0b" stroke-width="1.2" marker-end="url(#wf-ah)" d="M330,368 L330,308"/><text x="342" y="338" fill="#0b0b0b" font-size="11">3-1 core 차면 큐에 보관</text><path fill="none" stroke="#52514e" stroke-dasharray="4 3" stroke-width="1.2" marker-end="url(#wf-ah-muted)" d="M210,216 L210,246"/><text x="170" y="208" fill="#52514e" font-size="11">3-2 큐 무제한 — OOM·유실</text><path fill="none" stroke="#0b0b0b" stroke-width="1.2" marker-end="url(#wf-ah)" d="M425,410 L650,410 L650,176"/><text x="432" y="427" fill="#0b0b0b" font-size="11">4-1 큐도 차면 max까지 증설</text><path fill="none" stroke="#52514e" stroke-dasharray="4 3" stroke-width="1.2" marker-end="url(#wf-ah-muted)" d="M428,443 L428,416"/><text x="436" y="447" fill="#52514e" font-size="11">4-2 무제한 큐면 도달 불가 — core 8개 고정</text><path fill="none" stroke="#0b0b0b" stroke-width="1.2" marker-end="url(#wf-ah)" d="M340,276 L610,276 L610,194"/><text x="352" y="268" fill="#0b0b0b" font-size="11">5-1 꺼내서 실행</text><path fill="none" stroke="#52514e" stroke-dasharray="4 3" stroke-width="1.2" marker-end="url(#wf-ah-muted)" d="M498,360 L498,282"/><text x="509" y="352" fill="#52514e" font-size="11">5-2 submit() 예외는</text><text x="509" y="368" fill="#52514e" font-size="11">조용히 유실</text><path fill="none" stroke="#0b0b0b" stroke-widt