<svg viewBox="0 0 720 440" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, 'Segoe UI', 'Apple SD Gothic Neo', sans-serif" role="img" aria-label="glibc arena 멀티스레드 할당 경로 도식">
  <defs>
    <pattern id="lockHatch" width="6" height="6" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <rect width="6" height="6" fill="#fcfcfb"/>
      <line x1="0" y1="0" x2="0" y2="6" stroke="#e8b3a0" stroke-width="1.5"/>
    </pattern>
  </defs>

  <rect x="0.5" y="0.5" width="719" height="439" rx="8" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)"/>

  <text x="24" y="28" font-size="15" font-weight="700" fill="#0b0b0b">glibc arena — 멀티스레드 할당 경로</text>
  <text x="24" y="47" font-size="12" fill="#52514e">워커 스레드는 락이 없는 arena를 잡고, 그 안의 free 조각에서 버퍼를 할당한다</text>

  <!-- legend -->
  <g font-size="12" fill="#52514e">
    <rect x="400" y="17" width="10" height="10" rx="2" fill="#2a78d6"/>
    <text x="415" y="26">allocated</text>
    <rect x="482" y="17" width="10" height="10" rx="2" fill="#e1e0d9"/>
    <text x="497" y="26">free</text>
    <rect x="534" y="17" width="10" height="10" rx="2" fill="url(#lockHatch)" stroke="#c3c2b7"/>
    <text x="549" y="26">락 — 다른 스레드 보유</text>
  </g>

  <!-- arena 2 detail bar -->
  <text x="56" y="86" font-size="11" fill="#898781">arena 2 내부</text>
  <text x="436" y="86" font-size="11" fill="#eb6834" text-anchor="middle">③ free 조각 선택 · ④ 버퍼 할당</text>

  <rect x="56" y="94" width="110" height="48" fill="#2a78d6"/>
  <rect x="166" y="94" width="80" height="48" fill="#e1e0d9"/>
  <rect x="246" y="94" width="130" height="48" fill="#2a78d6"/>
  <rect x="376" y="94" width="120" height="48" fill="#e1e0d9" stroke="#eb6834" stroke-width="2" stroke-dasharray="5 3"/>
  <rect x="496" y="94" width="100" height="48" fill="#2a78d6"/>
  <rect x="596" y="94" width="68" height="48" fill="#e1e0d9"/>

  <g font-size="12" text-anchor="middle">
    <text x="111" y="122" fill="#ffffff">allocated</text>
    <text x="206" y="122" fill="#52514e">free</text>
    <text x="311" y="122" fill="#ffffff">allocated</text>
    <text x="436" y="122" fill="#52514e">free → 버퍼</text>
    <text x="546" y="122" fill="#ffffff">allocated</text>
    <text x="630" y="122" fill="#52514e">free</text>
  </g>

  <!-- zoom guide from arena 2 box to detail bar -->
  <line x1="214" y1="210" x2="56" y2="142" stroke="#c3c2b7" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="278" y1="210" x2="664" y2="142" stroke="#c3c2b7" stroke-width="1" stroke-dasharray="4 3"/>

  <!-- arena row -->
  <g font-size="12" text-anchor="middle">
    <rect x="62" y="210" width="64" height="52" fill="#fcfcfb" stroke="#c3c2b7"/>
    <text x="94" y="240" fill="#52514e">arena 0</text>

    <rect x="138" y="210" width="64" height="52" fill="url(#lockHatch)" stroke="#c3c2b7"/>
    <text x="170" y="240" fill="#52514e">arena 1</text>

    <rect x="214" y="210" width="64" height="52" fill="#fcfcfb" stroke="#eb6834" stroke-width="2"/>
    <text x="246" y="240" fill="#eb6834">arena 2</text>

    <rect x="290" y="210" width="64" height="52" fill="url(#lockHatch)" stroke="#c3c2b7"/>
    <text x="322" y="240" fill="#52514e">arena 3</text>

    <rect x="366" y="210" width="64" height="52" fill="#fcfcfb" stroke="#c3c2b7"/>
    <text x="398" y="240" fill="#52514e">arena 4</text>

    <rect x="442" y="210" width="64" height="52" fill="url(#lockHatch)" stroke="#c3c2b7"/>
    <text x="474" y="240" fill="#52514e">arena 5</text>

    <rect x="518" y="210" width="64" height="52" fill="url(#lockHatch)" stroke="#c3c2b7"/>
    <text x="550" y="240" fill="#52514e">arena 6</text>

    <rect x="594" y="210" width="64" height="52" fill="url(#lockHatch)" stroke="#c3c2b7"/>
    <text x="626" y="240" fill="#52514e">arena 7</text>
  </g>
  <text x="246" y="278" font-size="11" fill="#eb6834" text-anchor="middle">worker 1이 락 보유</text>

  <!-- worker -->
  <circle cx="246" cy="352" r="30" fill="#fcfcfb" stroke="#eb6834" stroke-width="1.5"/>
  <text x="246" y="349" font-size="12" fill="#eb6834" text-anchor="middle">worker</text>
  <text x="246" y="364" font-size="12" fill="#eb6834" text-anchor="middle">1</text>

  <!-- PDF -->
  <path d="M60 328 h34 l10 10 v34 h-44 Z" fill="#fcfcfb" stroke="#52514e"/>
  <path d="M94 328 v10 h10 Z" fill="#e1e0d9" stroke="#52514e"/>
  <text x="82" y="356" font-size="12" font-weight="700" fill="#52514e" text-anchor="middle">PDF</text>

  <!-- step 1: PDF -> worker -->
  <line x1="112" y1="352" x2="208" y2="352" stroke="#898781" stroke-width="1"/>
  <path d="M216 352 L208 348 L208 356 Z" fill="#898781"/>
  <text x="160" y="344" font-size="11" fill="#52514e" text-anchor="middle">① PDF 전달</text>

  <!-- step 2: worker -> arena 2 -->
  <line x1="246" y1="322" x2="246" y2="290" stroke="#898781" stroke-width="1"/>
  <path d="M246 288 L242 296 L250 296 Z" fill="#898781"/>
  <text x="262" y="308" font-size="11" fill="#52514e">② 락이 없는 arena를 골라 락 획득</text>

  <!-- footnote -->
  <text x="360" y="416" font-size="11" fill="#898781" text-anchor="middle">스레드는 한 번 붙은 arena를 계속 재사용한다 · 락 경합이 나면 다른 arena를 시도하거나 새로 만든다</text>
</svg>
