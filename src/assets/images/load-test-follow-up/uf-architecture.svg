<text class="small" x="40" y="91">클릭 로그를 파일로 보관하고, EC2에서 UF로 수집·전송</text>

<rect x="650" y="158" width="570" height="450" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/>
