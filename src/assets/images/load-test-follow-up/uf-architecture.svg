<text class="label center" x="787" y="325">로그 디렉터리</text>
<text class="small center" x="787" y="355">EFS 마운트</text>
<path class="line" d="M604 335 H684"/>
<text class="small center" x="644" y="263">마운트</text>

<rect class="box" x="980" y="260" width="214" height="150" rx="10"/>
<text class="label center" x="1087" y="302">Splunk UF</text>
