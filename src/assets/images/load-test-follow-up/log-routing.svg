<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="374" viewBox="0 0 1120 374" role="img" aria-labelledby="title desc">
  <title id="title">Logback 출력과 FireLens 로그 분기</title>
  <desc id="desc">일반 로그는 root 로거에서 CONSOLE과 OTEL로 출력합니다. 통계 이벤트는 전용 로거에서 CONSOLE_RAW로만 출력합니다. FireLens의 Fluent Bit은 콘솔 로그를 모아 logtype이 splunk이면 Splunk HEC로, 나머지는 CloudWatch로 보냅니다.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1 1 7 4 1 7" fill="none" stroke="#64748b" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; }
      .column { fill: #64748b; font-size: 15px; font-weight: 500; }
      .box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.2; }
      .name { fill: #1e293b; font-size: 20px; font-weight: 600; text-anchor: middle; }
      .note { fill: #64748b; font-size: 14px; text-anchor: middle; }
      .line { fill: none; stroke: #64748b; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1120" height="374" rx="14" fill="#f8fafc"/>
  <text class="column" x="32" y="43">Logback</text>
  <text class="column" x="310" y="43">출력 경로</text>
  <text class="column" x="530" y="43">수집 · 분기</text>
  <text class="column" x="910" y="43">목적지</text>

  <path class="line" d="M210 168 H248 V110 H310"/>
  <path class="line" d="M210 168 H310"/>
  <path class="line" d="M210 292 H310"/>
  <path class="line" d="M470 184 H500 V226 H530"/>
  <path class="line" d="M470 292 H500 V246 H530"/>
  <path class="line" d="M732 236 H780 V176 H910"/>
  <path class="line" d="M732 236 H780 V300 H910"/>
  <text class="note" x="845" y="158">그 외</text>
  <text class="note" x="845" y="281">logtype=splunk</text>

  <rect class="box" x="32" y="136" width="178" height="64" rx="8"/>
  <text class="name" x="121" y="163">일반 로그</text>
  <text class="note" x="121" y="185">root 로거</text>
  <rect class="box" x="32" y="260" width="178" height="64" rx="8"/>
  <text class="name" x="121" y="287">통계 이벤트</text>
  <text class="note" x="121" y="309">전용 로거</text>
  <text class="note" x="121" y="348">additivity=false</text>

  <rect class="box" x="310" y="78" width="160" height="64" rx="8"/>
  <text class="name" x="390" y="118">OTEL</text>
  <rect class="box" x="310" y="152" width="160" height="64" rx="8"/>
  <text class="name" x="390" y="192">CONSOLE</text>
  <rect class="box" x="310" y="260" width="160" height="64" rx="8"/>
  <text class="name" x="390" y="300" style="font-size: 18px">CONSOLE_RAW</text>

  <rect class="box" x="530" y="204" width="202" height="64" rx="8"/>
  <text class="name" x="631" y="231">FireLens</text>
  <text class="note" x="631" y="253">Fluent Bit</text>

  <rect class="box" x="910" y="144" width="178" height="64" rx="8"/>
  <text class="name" x="999" y="184">CloudWatch</text>
  <rect class="box" x="910" y="268" width="178" height="64" rx="8"/>
  <text class="name" x="999" y="308">Splunk HEC</text>
</svg>
